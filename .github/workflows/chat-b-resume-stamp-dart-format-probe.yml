name: Chat B resume source-stamp formatter check
on:
  push:
    branches:
      - feat/chat-b/resume-snapshot-stale-20261105
    paths:
      - .github/workflows/chat-b-resume-stamp-dart-format-probe.yml
      - app/test/campaign_resume_stale_snapshot_test.dart
      - app/lib/story/campaign_resume_context.dart
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Print exactly what Dart would reformat
        run: |
          dart format app/lib/story/campaign_resume_context.dart app/test/campaign_resume_stale_snapshot_test.dart
          git diff -- app/lib/story/campaign_resume_context.dart app/test/campaign_resume_stale_snapshot_test.dart
