name: Temporary Fantasy Dart Format Probe
on:
  push:
    branches:
      - feature/fantasy-class-confirmation-fixes-20261021
jobs:
  formatter-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
      - name: Print Dart formatter changes
        run: |
          cd app
          dart format lib/domain/srd_sphere_area_rules.dart test/ui_character_editor_test.dart
          git diff -- lib/domain/srd_sphere_area_rules.dart test/ui_character_editor_test.dart
