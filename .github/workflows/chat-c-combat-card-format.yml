name: Chat C combatant card Dart formatting diagnostic

on:
  push:
    branches:
      - feat/chat-c/combatant-card-large-text-20261026
    paths:
      - .github/workflows/chat-c-combat-card-format.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Canonical UI formatting
        run: dart format --output=show app/lib/ui/fantasy_combatant_card.dart
      - name: Canonical widget tests formatting
        run: dart format --output=show app/test/fantasy_combatant_card_test.dart
