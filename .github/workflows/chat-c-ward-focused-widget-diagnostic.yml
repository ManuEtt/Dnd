name: Chat C Ward Focused Widget Diagnostic
on:
  push:
    branches:
      - feat/chat-c/ward-management-large-text-20261106
jobs:
  ward-widget:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Install Flutter dependencies
        run: cd app && flutter pub get
      - name: Run five focused ward widget regressions
        run: cd app && flutter test test/fantasy_ward_management_large_text_test.dart --reporter expanded --timeout 60s
