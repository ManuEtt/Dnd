name: Temporary Dart formatter diagnostics

on:
  push:
    branches:
      - feat/chat-c/hero-hp-screenreader-20261114

permissions:
  contents: read

jobs:
  show-format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Show exact formatter changes
        shell: bash
        run: |
          cd app
          dart format test/fantasy_active_hero_hp_accessibility_test.dart
          git diff -- test/fantasy_active_hero_hp_accessibility_test.dart
