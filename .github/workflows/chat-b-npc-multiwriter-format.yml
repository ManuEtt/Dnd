name: Chat B temporary SQLite multiwriter format check
on:
  push:
    branches:
      - test/chat-b/npc-outbox-multiwriter-cas-20261027
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.9.2'
      - name: Print exact Dart format
        run: dart format --output=show app/test/npc_outbox_multiwriter_cas_test.dart
