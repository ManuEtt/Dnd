name: Chat C formatter diagnostic (temporary)

on:
  push:
    branches:
      - feat/chat-c/sheet-header-large-text-20261029
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Print only the official Dart formatter diff
        run: |
          cp app/test/fantasy_character_header_large_text_test.dart /tmp/chat-c-before.dart
          dart format app/test/fantasy_character_header_large_text_test.dart
          diff -u /tmp/chat-c-before.dart app/test/fantasy_character_header_large_text_test.dart || true
