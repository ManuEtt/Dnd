name: Chat C Dart format diagnostic

on:
  push:
    branches:
      - fix/chat-c/npc-chronicle-fallback-20261025
    paths:
      - .github/workflows/chat-c-format-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Print canonical formatted widget test
        run: dart format --output=show app/test/campaign_memory_panel_test.dart
