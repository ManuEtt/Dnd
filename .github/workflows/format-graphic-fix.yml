name: Format Graphic Fix Branch
on:
  push:
    branches:
      - fix/graphic-assets-fallback-20261019
    paths:
      - '.github/workflows/format-graphic-fix.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/graphic-assets-fallback-20261019
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Run pinned Dart formatter
        run: |
          dart format app/lib/ui/character_portrait_picker.dart app/test/high_resolution_portrait_fallback_test.dart
          dart format --output=none --set-exit-if-changed app/lib/ui/character_portrait_picker.dart app/test/high_resolution_portrait_fallback_test.dart
      - name: Commit exact formatting changes
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/lib/ui/character_portrait_picker.dart app/test/high_resolution_portrait_fallback_test.dart
            git commit -m 'style(ui): format high-res portrait fallback'
            git push origin HEAD:fix/graphic-assets-fallback-20261019
          fi
