name: Chat C focus diagnosis (temporary)
on:
  push:
    branches:
      - feat/chat-c/pending-action-controls-large-text-20261030
jobs:
  focus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Resolve Flutter dependencies
        run: cd app && flutter pub get
      - name: Verify formatting and test keyboard traversal
        run: |
          cd app
          dart format lib/ui/pending_action_status.dart test/pending_action_controls_large_text_test.dart
          git diff -- lib/ui/pending_action_status.dart test/pending_action_controls_large_text_test.dart
          flutter test test/pending_action_controls_large_text_test.dart --reporter expanded
