name: Ranger Roving format diagnostic
on:
  push:
    branches:
      - feat/chat-a/ranger-roving-20261027
permissions:
  contents: read
jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Print required Dart 3.9 formatting changes
        run: |
          dart format app/test/ranger_roving_rules_test.dart app/test/ranger_roving_sheet_test.dart
          git diff -- app/test/ranger_roving_rules_test.dart app/test/ranger_roving_sheet_test.dart
