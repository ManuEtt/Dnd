name: One-shot Fireball reset Dart formatting
on:
  push:
    branches: [feature/fireball-preview-reset-20261021]
    paths:
      - .github/workflows/format-fireball-reset-once-20261021.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'ManuEtt/Dnd' && github.ref == 'refs/heads/feature/fireball-preview-reset-20261021'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Apply exact SDK formatter and self-remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          dart format app/test/srd_fireball_grid_preview_dialog_test.dart
          dart format --output=none --set-exit-if-changed app/test/srd_fireball_grid_preview_dialog_test.dart
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/format-fireball-reset-once-20261021.yml
          git add -- app/test/srd_fireball_grid_preview_dialog_test.dart
          git commit -m 'style(test): apply official Dart formatter to Fireball reset checks'
          git push origin HEAD:refs/heads/feature/fireball-preview-reset-20261021
