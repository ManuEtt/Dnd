name: Temporäre Formatierung Heldenkorrektur
on:
  push:
    branches:
      - fix/hero-values-campaign-progress-20261021
    paths:
      - .github/workflows/format-hero-fix-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hero-values-campaign-progress-20261021
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Formatiere geänderte Dart-Tests
        run: |
          set -euo pipefail
          dart format app/test/ui_starting_combat_values_test.dart app/test/controller_integration_test.dart app/test/storage_repository_test.dart
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/test/ui_starting_combat_values_test.dart app/test/controller_integration_test.dart app/test/storage_repository_test.dart
          if ! git diff --cached --quiet; then
            git commit -m 'style(tests): apply official Dart 3.9 formatter'
            git push origin HEAD:fix/hero-values-campaign-progress-20261021
          fi
