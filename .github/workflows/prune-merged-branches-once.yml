name: Einmalige Bereinigung bereits integrierter Zweige

on:
  push:
    branches:
      - feature/fantasy-portraits-and-ui-20261019
    paths:
      - .github/workflows/prune-merged-branches-once.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Ausschließlich nachgewiesen integrierte Branches entfernen
        shell: bash
        run: |
          set -euo pipefail
          # Entry format: name|exact expected head sha|verified merged PR number.
          # Branches with unique/unmerged work are intentionally absent.
          candidates=(
            'Waffen|c344c672be0d1b1830e533eef70ed587816065b7|1'
            'feature/structured-inventory-20261018|6cd9280744d581414a509bfd27c379068f677673|2'
            'feature/fighter-start-xp-20261018|0426f610de172bf932a933e6051daa272ce564e1|3'
            'feature/fighter-style-combat-20261018|0de2c4a7e8be62e443f4ffab0260366ad939ff5d|4'
            'feature/great-weapon-style-20261018|2ab3e43e0d0e654c81f0707c37131b628d5b7f4c|5'
            'feature/two-weapon-fighting-20261018|5fd40acef2266addd0f1f9ac7829603efdbfeeef|6'
            'feature/condition-source-ledger-20261018|3af713de5930b2bb14e3ab92f53bf552e96549d5|7'
            'feature/prone-stand-movement-20261019|471e154dd3bcf6eaa11f9edbadf8ec7988df6a9a|8'
            'feature/srd-character-level-up-20261019|925b267d5db55f71ce71aa04f2ea1d8c8bcc5ca5|11'
            'integration/character-creation-20261019|3be9bb8c46b8a6fd08e1b7b395f7bfb44d8fa2b2|13'
          )
          removed=0
          skipped=0
          for item in "${candidates[@]}"; do
            IFS='|' read -r name expected pr <<< "$item"
            if [[ "$name" == 'main' || "$name" == "$GITHUB_REF_NAME" ]]; then
              echo "SKIP $name: geschützter Zielzweig"
              skipped=$((skipped+1))
              continue
            fi
            data=$(gh api "repos/$GH_REPO/branches/$name" 2>/dev/null) || {
              echo "SKIP $name: nicht vorhanden"
              skipped=$((skipped+1))
              continue
            }
            actual=$(jq -r '.commit.sha' <<< "$data")
            protected=$(jq -r '.protected' <<< "$data")
            pr_json=$(gh api "repos/$GH_REPO/pulls/$pr")
            merged=$(jq -r '.merged_at' <<< "$pr_json")
            pr_sha=$(jq -r '.head.sha' <<< "$pr_json")
            pr_branch=$(jq -r '.head.ref' <<< "$pr_json")
            open_count=$(gh api --paginate "repos/$GH_REPO/pulls?state=open&per_page=100" \
              --jq '.[] | select(.head.ref == "'"$name"'") | .number' | wc -l)
            if [[ "$actual" != "$expected" || "$protected" != false ||
                  "$merged" == null || "$pr_sha" != "$expected" ||
                  "$pr_branch" != "$name" || "$open_count" != 0 ]]; then
              echo "SKIP $name: Nachweis nicht mehr exakt gültig"
              skipped=$((skipped+1))
              continue
            fi
            echo "Entferne bestätigten Merge-Zweig: $name (PR #$pr)"
            gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$name"
            removed=$((removed+1))
          done
          echo "Bereinigung abgeschlossen: $removed entfernt; $skipped übersprungen."
