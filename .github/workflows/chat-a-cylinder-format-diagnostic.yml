name: Chat A Cylinder formatter diagnostic (temporary)
on:
  push:
    branches:
      - feat/chat-a/cylinder-area-preview-20261028

jobs:
  dart-format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Print official Dart formatter patch
        run: |
          cd app
          dart format test/srd_cylinder_area_rules_test.dart
          git diff -- test/srd_cylinder_area_rules_test.dart
