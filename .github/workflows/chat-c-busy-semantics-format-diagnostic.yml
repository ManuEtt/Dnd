name: Chat C Busy Semantics Dart Format Diagnostic
on:
  push:
    branches:
      - feat/chat-c/quick-actions-busy-semantics-20261106
jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Show exact formatter changes
        run: |
          dart format app/lib/ui/fantasy_art.dart app/test/fantasy_quick_actions_busy_semantics_test.dart
          git --no-pager diff -- app/lib/ui/fantasy_art.dart app/test/fantasy_quick_actions_busy_semantics_test.dart
