name: One-time official Dart formatting for PR 219
on:
  push:
    branches:
      - integration/combatant-card-gradle-keys-20261026
    paths:
      - .github/workflows/one-time-format-combatant-pr219.yml
permissions:
  contents: write
jobs:
  format-test:
    if: github.repository == 'ManuEtt/Dnd'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/combatant-card-gradle-keys-20261026
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Format test with official Dart 3 formatter
        shell: bash
        run: |
          set -euo pipefail
          dart format app/test/fantasy_combatant_card_test.dart
          if git diff --quiet -- app/test/fantasy_combatant_card_test.dart; then
            echo 'No formatter changes needed'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/test/fantasy_combatant_card_test.dart
            git commit -m 'style(test): apply official Dart formatter to combatant card tests'
            git push origin HEAD:refs/heads/integration/combatant-card-gradle-keys-20261026
          fi
