name: Chat C temporary portrait widget regression

on:
  push:
    branches:
      - feat/chat-c/portrait-picker-large-text-actions-20261103

jobs:
  portrait-widgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
      - name: Test portrait picker and existing portrait coverage
        run: |
          cd app
          flutter pub get
          dart format --output=none --set-exit-if-changed lib/ui/character_portrait_picker.dart test/character_portrait_large_text_actions_test.dart
          flutter test test/character_portrait_large_text_actions_test.dart test/character_portrait_test.dart
