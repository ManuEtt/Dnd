name: Einmalige Formatierung des Zustandsregisters
on:
  push:
    branches:
      - feature/condition-source-ledger-20261018
    paths:
      - .github/workflows/format-condition-ledger-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/condition-source-ledger-20261018
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Offizielle Dart-Formatierung anwenden
        working-directory: app
        run: dart format lib/domain/condition_effects.dart lib/domain/models.dart test/condition_effects_test.dart
      - name: Ausschließlich Formatierung committen
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/lib/domain/condition_effects.dart app/lib/domain/models.dart app/test/condition_effects_test.dart
          git commit -m 'style: format sourced condition domain and tests'
          git push origin HEAD:refs/heads/feature/condition-source-ledger-20261018
