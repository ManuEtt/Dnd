name: Chat B temporary deterministic NPC formatter
on:
  push:
    branches:
      - fix/chat-b/npc-resume-deterministic-regressions-20261027
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.9.2'
      - name: Show official formatted sources
        run: |
          echo 'CHAT_B_BEGIN_0'
          dart format --output=show app/lib/services/npc_pending_action_recovery.dart
          echo 'CHAT_B_END_0'
          echo 'CHAT_B_BEGIN_1'
          dart format --output=show app/lib/ui/app.dart
          echo 'CHAT_B_END_1'
          echo 'CHAT_B_BEGIN_2'
          dart format --output=show app/test/npc_ui_outbox_restart_integration_test.dart
          echo 'CHAT_B_END_2'
