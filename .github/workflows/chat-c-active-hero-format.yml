name: Chat C active hero Dart formatting diagnostic

on:
  push:
    branches:
      - feat/chat-c/accessible-active-hero-20261025
    paths:
      - .github/workflows/chat-c-active-hero-format.yml

permissions:
  contents: read

jobs:
  print-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Canonical dashboard layout
        run: dart format --output=show app/lib/ui/fantasy_campaign_dashboard.dart
      - name: Canonical dashboard widget tests
        run: dart format --output=show app/test/fantasy_campaign_dashboard_test.dart
