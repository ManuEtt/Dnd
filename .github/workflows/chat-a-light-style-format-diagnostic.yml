name: Temporary Two-Weapon Style Dart Formatter Diff
on:
  push:
    branches:
      - fix/chat-a/two-weapon-style-paladin-ranger-20261106
  workflow_dispatch:
jobs:
  format-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Show exact Dart format diff
        run: |
          cd app
          dart format test/two_weapon_style_class_eligibility_test.dart
          git --no-pager diff -- test/two_weapon_style_class_eligibility_test.dart
