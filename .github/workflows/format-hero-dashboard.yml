name: Format Hero Dashboard
on:
  push:
    branches:
      - feature/hero-campaign-dashboard-20261019
    paths:
      - '.github/workflows/format-hero-dashboard.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hero-campaign-dashboard-20261019
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Dart-Code korrekt formatieren
        run: |
          dart format app/lib/ui/fantasy_campaign_dashboard.dart app/lib/ui/app.dart app/test/fantasy_campaign_dashboard_test.dart
          dart format --output=none --set-exit-if-changed app/lib/ui/fantasy_campaign_dashboard.dart app/lib/ui/app.dart app/test/fantasy_campaign_dashboard_test.dart
      - name: Formatierung übernehmen
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/lib/ui/fantasy_campaign_dashboard.dart app/lib/ui/app.dart app/test/fantasy_campaign_dashboard_test.dart
            git commit -m 'style(ui): Dart-format hero dashboard'
            git push origin HEAD:feature/hero-campaign-dashboard-20261019
          fi
