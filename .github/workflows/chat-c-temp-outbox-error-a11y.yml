name: Chat C temporary outbox error a11y diagnostics
on:
  push:
    branches:
      - feat/chat-c/pending-error-live-region-20261105
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Diagnose formatting and run focused tests
        run: |
          cd app
          flutter pub get
          dart format lib/ui/pending_action_status.dart test/pending_action_error_semantics_test.dart
          git diff -- lib/ui/pending_action_status.dart test/pending_action_error_semantics_test.dart
          flutter analyze
          flutter test test/pending_action_error_semantics_test.dart test/pending_action_status_test.dart test/pending_action_controls_large_text_test.dart
