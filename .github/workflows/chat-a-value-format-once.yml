name: Chat A - einmalige Materialwert-Dartformatierung
on:
  push:
    branches:
      - feat/chat-a/spell-material-value-evidence-20261030
    paths:
      - .github/workflows/chat-a-value-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Beide neuen Chat-A-Dartdateien offiziell formatieren
        working-directory: app
        run: |
          dart --version
          dart format lib/domain/srd_spell_material_value_rules.dart test/srd_spell_material_value_rules_test.dart
          dart format --output=none --set-exit-if-changed lib/domain/srd_spell_material_value_rules.dart test/srd_spell_material_value_rules_test.dart
      - name: Nur offiziell formatierte Fach- und Testdatei committen
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if ! git diff --quiet -- app/lib/domain/srd_spell_material_value_rules.dart app/test/srd_spell_material_value_rules_test.dart; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- app/lib/domain/srd_spell_material_value_rules.dart app/test/srd_spell_material_value_rules_test.dart
            git commit -m 'style(chat-a): apply Dart 3.9 formatter to material value rules and tests'
            git push origin HEAD:feat/chat-a/spell-material-value-evidence-20261030
          fi
