name: Chat C combat seals isolated formatter and test diagnostic

on:
  push:
    branches:
      - feat/chat-c/threat-status-talkback-20261026
    paths:
      - .github/workflows/chat-c-threat-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Show canonical Dart formatting
        working-directory: app
        run: |
          echo '===CHAT-C-FORMATTED-START==='
          dart format --output=show test/fantasy_combat_threat_status_test.dart
          echo '===CHAT-C-FORMATTED-END==='
      - name: Generate UI assets
        run: python3 scripts/generate_fantasy_buttons.py
      - name: Install Flutter deps
        working-directory: app
        run: flutter pub get
      - name: Run isolated threat status widget tests
        working-directory: app
        run: flutter test test/fantasy_combat_threat_status_test.dart
      - name: Analyze changed widgets
        working-directory: app
        run: flutter analyze lib/ui/fantasy_combat_threat_status.dart test/fantasy_combat_threat_status_test.dart
