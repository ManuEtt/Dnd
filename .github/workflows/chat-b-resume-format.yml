name: Chat B temporary resume formatter
on:
  push:
    branches:
      - feat/chat-b/read-only-resume-context-20261101

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.9.2'
      - name: Output officially formatted Dart for Chat B
        run: |
          echo 'CHAT_B_RESUME_BEGIN_MODULE'
          dart format --output=show app/lib/story/campaign_resume_context.dart
          echo 'CHAT_B_RESUME_END_MODULE'
          echo 'CHAT_B_RESUME_BEGIN_TEST'
          dart format --output=show app/test/campaign_resume_context_test.dart
          echo 'CHAT_B_RESUME_END_TEST'
