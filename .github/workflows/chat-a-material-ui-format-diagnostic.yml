name: Chat A UI exact Dart formatting
on:
  push:
    branches:
      - feat/chat-a/material-inventory-dialog-20261027
    paths:
      - .github/workflows/chat-a-material-ui-format-diagnostic.yml
jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.9.2'
      - name: Print exact UI formatter diff
        run: |
          dart format app/lib/ui/srd_material_inventory_dialog.dart app/test/srd_material_inventory_dialog_test.dart
          git diff -- app/lib/ui/srd_material_inventory_dialog.dart app/test/srd_material_inventory_dialog_test.dart
