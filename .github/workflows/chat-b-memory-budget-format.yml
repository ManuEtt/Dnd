name: Chat B temporary memory formatter
on:
  push:
    branches:
      - fix/chat-b/npc-memory-budget-20261027
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.9.2'
      - name: Show official Dart formatting
        run: |
          echo 'CHAT_B_BEGIN_SOURCE'
          dart format --output=show app/lib/story/npc_narrator_memory.dart
          echo 'CHAT_B_END_SOURCE'
          echo 'CHAT_B_BEGIN_TEST'
          dart format --output=show app/test/npc_narrator_memory_test.dart
          echo 'CHAT_B_END_TEST'
