name: Temporary Sending Dart format diagnostics
on:
  push:
    paths:
      - '.github/workflows/temp-sending-format-check.yml'
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Show actual Dart formatting patch
        run: |
          cd app
          dart format lib/domain/srd_sending_cast_preflight_rules.dart test/srd_sending_cast_commit_test.dart
          git diff -- lib/domain/srd_sending_cast_preflight_rules.dart test/srd_sending_cast_commit_test.dart
