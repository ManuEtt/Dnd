name: EP-Erweiterung einmalig formatieren
on:
  push:
    branches:
      - feature/rabenwacht-quest-journal-20261019
    paths:
      - '.github/workflows/xp-format-once.yml'

permissions:
  contents: write

jobs:
  dart-format:
    if: "github.event.head_commit.message == 'chore: format XP and level-up changes'"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rabenwacht-quest-journal-20261019
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Neue Dart-Dateien formatieren und prüfen
        working-directory: app
        run: |
          dart format lib/domain/campaign_experience.dart lib/domain/rabenwacht_campaign.dart lib/ui/app.dart test/campaign_experience_test.dart
          dart format --output=none --set-exit-if-changed lib test
      - name: Formatierten Quellcode einchecken
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/lib/domain/campaign_experience.dart app/lib/domain/rabenwacht_campaign.dart app/lib/ui/app.dart app/test/campaign_experience_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "style(xp): format experience system using Dart 3.9"
            git push origin HEAD:feature/rabenwacht-quest-journal-20261019
          fi
