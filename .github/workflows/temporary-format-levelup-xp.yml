name: Temporary format level-up XP integration

on:
  push:
    branches:
      - feature/level-up-xp-sequential-20261020

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/level-up-xp-sequential-20261020
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
      - name: Resolve Flutter dependencies
        run: cd app && flutter pub get
      - name: Format Dart files and commit
        shell: bash
        run: |
          set -euo pipefail
          cd app
          dart format lib test
          cd ..
          if ! git diff --quiet -- app/lib app/test; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/lib app/test
            git commit -m "style: format XP and level-up changes"
            git push origin HEAD:feature/level-up-xp-sequential-20261020
          fi
