name: Chat B resume lead Dart formatter diagnostic
on:
  push:
    branches:
      - feat/chat-b/resume-lead-id-integrity-20261104
    paths:
      - .github/workflows/chat-b-resume-lead-formatter-probe.yml
      - app/test/campaign_resume_lead_id_integrity_test.dart
      - app/lib/story/campaign_resume_context.dart
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Show exact Dart 3.9 formatter diff
        run: |
          dart format app/lib/story/campaign_resume_context.dart app/test/campaign_resume_lead_id_integrity_test.dart
          git diff -- app/lib/story/campaign_resume_context.dart app/test/campaign_resume_lead_id_integrity_test.dart
