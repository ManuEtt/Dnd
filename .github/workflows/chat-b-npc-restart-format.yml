name: Chat B temporary NPC restart formatter
on:
  push:
    branches:
      - test/chat-b/npc-ui-restart-reconciliation-20261027
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.9.2'
      - name: Show official formatted test
        run: dart format --output=show app/test/npc_ui_outbox_restart_integration_test.dart
