name: Chat C temporary tracked initiative formatter
on:
  push:
    branches:
      - feat/chat-c/tracked-initiative-ime-20261102
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.9.2'
      - name: Show official formatter diff
        run: |
          dart format app/lib/ui/tracked_creature_initiative_dialog.dart app/test/tracked_creature_initiative_ime_test.dart
          git diff -- app/lib/ui/tracked_creature_initiative_dialog.dart app/test/tracked_creature_initiative_ime_test.dart
