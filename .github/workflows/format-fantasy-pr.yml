name: Fantasy-PR einmalig formatieren

on:
  push:
    branches:
      - feature/fantasy-assets-2026-10-19
    paths:
      - '.github/workflows/format-fantasy-pr.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fantasy-assets-2026-10-19
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Freigegebene Dart-Dateien formatieren
        run: |
          dart format app/lib/ui/app.dart app/lib/ui/fantasy_art.dart app/lib/ui/fantasy_ui.dart app/lib/ui/fantasy_approved_icons.dart app/lib/ui/character_portrait_picker.dart app/test/fantasy_artwork_smoke_test.dart
          dart format --output=none --set-exit-if-changed app/lib/ui/app.dart app/lib/ui/fantasy_art.dart app/lib/ui/fantasy_ui.dart app/lib/ui/fantasy_approved_icons.dart app/lib/ui/character_portrait_picker.dart app/test/fantasy_artwork_smoke_test.dart
      - name: Formatierung committen
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- app/lib/ui/app.dart app/lib/ui/fantasy_art.dart app/lib/ui/fantasy_ui.dart app/lib/ui/fantasy_approved_icons.dart app/lib/ui/character_portrait_picker.dart app/test/fantasy_artwork_smoke_test.dart
            git commit -m 'style(ui): format approved fantasy artwork integration'
            git push origin HEAD:feature/fantasy-assets-2026-10-19
          fi
