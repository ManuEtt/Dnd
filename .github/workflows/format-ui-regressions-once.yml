name: Einmalige Formatierung der UI-Korrekturen
on:
  push:
    branches:
      - fix/app-version-and-portrait-ci-20261019
    paths:
      - .github/workflows/format-ui-regressions-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/app-version-and-portrait-ci-20261019
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Dart formatieren und überprüfen
        working-directory: app
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test
      - name: Nur die formatierten Dart-Dateien sichern
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then exit 0; fi
          if git diff --name-only | grep -vE '^app/(lib|test)/.*[.]dart$'; then
            echo 'Unexpected changes' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/lib app/test
          git commit -m 'style: format version and fantasy-editor regression fixes'
          git push origin HEAD:refs/heads/fix/app-version-and-portrait-ci-20261019
