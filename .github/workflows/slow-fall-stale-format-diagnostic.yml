name: Slow Fall stale test Dart formatter diagnostic
on:
  push:
    branches:
      - fix/chat-a/slow-fall-stale-dialog-20261027
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: |
          dart format app/test/monk_slow_fall_stale_dialog_ui_test.dart
          git diff -- app/test/monk_slow_fall_stale_dialog_ui_test.dart
