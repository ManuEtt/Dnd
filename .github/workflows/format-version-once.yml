name: Einmalige Versions-Formatter-Prüfung

on:
  push:
    branches:
      - feature/fantasy-portraits-and-ui-20261019
    paths:
      - .github/workflows/format-version-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fantasy-portraits-and-ui-20261019
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Format and verify
        working-directory: app
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test
      - name: Commit only formatting
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then exit 0; fi
          if git diff --name-only | grep -vE '^app/(lib|test)/.*[.]dart$'; then
            echo 'Unexpected modified files' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/lib app/test
          git commit -m 'style: apply Dart 3.9 formatter to app version tests'
          git push origin HEAD:refs/heads/feature/fantasy-portraits-and-ui-20261019
