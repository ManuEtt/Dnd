name: Geprüfte Charakterbogen-Branch-Bereinigung (2026-10-23)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-character-branches-20261023.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retire-verified-character-branches:
    if: github.repository == 'ManuEtt/Dnd' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prüfen, Recovery-Tags sichern und ausschließlich geprüfte Branches löschen
        uses: actions/github-script@v7
        with:
          script: |
            const repo = {owner: 'ManuEtt', repo: 'Dnd'};
            const merged = {
              name: 'fix/character-sheet-single-attributes-20261023',
              sha: '8ca5d5196ecd1d6cbae196e5c79514f09b303c14',
              pr: 125,
            };
            const superseded = {
              name: 'fix/character-sheet-duplicate-attributes-20261023',
              sha: '4c8765019ab089d4a85259e7fe4d42bda3236089',
              pr: 124,
            };
            const targets = [merged, superseded];
            const rootMerge = 'ff92e0dabdcb8a9da6a9da4771af3bdad9e3df68';
            const mainSourceSha = '6531e90a5f9674609302488be70183b2c4e64cfb';
            const oldSourceSha = '9255a51dde442d5da274cd71e092a3444c15d4b9';
            const sheet = 'app/lib/ui/fantasy_character_sheet.dart';
            if (context.repo.owner !== repo.owner ||
                context.repo.repo !== repo.repo ||
                context.ref !== 'refs/heads/main') {
              throw new Error('Ausführung ausschließlich in ManuEtt/Dnd auf main erlaubt.');
            }
            const getBranch = async name => {
              try {return (await github.rest.repos.getBranch({...repo, branch: name})).data;}
              catch (e) {if (e.status === 404) return null; throw e;}
            };
            const getText = async ref => {
              const r = (await github.rest.repos.getContent({...repo, path: sheet, ref})).data;
              if (Array.isArray(r) || r.type !== 'file') throw new Error('Charakterbogen-Quelle fehlt.');
              return {sha: r.sha, text: Buffer.from(r.content, 'base64').toString('utf8')};
            };
            const main = await getBranch('main');
            if (!main || main.commit.sha !== context.sha)
              throw new Error('main wurde seit Start dieses Audits geändert.');
            const ancestry = (await github.rest.repos.compareCommits({
              ...repo, base: rootMerge, head: main.commit.sha,
            })).data;
            if (ancestry.behind_by !== 0 ||
                !['identical', 'ahead'].includes(ancestry.status))
              throw new Error('main enthält den geprüften Merge #125 nicht.');
            const prs = await Promise.all(targets.map(async target =>
              (await github.rest.pulls.get({...repo, pull_number: target.pr})).data));
            for (let i = 0; i < targets.length; i++) {
              const t = targets[i], pr = prs[i];
              if (pr.base.ref !== 'main' || pr.head.ref !== t.name ||
                  pr.head.sha !== t.sha || pr.head.repo?.full_name !== 'ManuEtt/Dnd')
                throw new Error('PR-Branch, Basis oder HEAD stimmt nicht: #' + t.pr);
            }
            if (!prs[0].merged || !prs[0].merged_at ||
                prs[0].merge_commit_sha !== rootMerge)
              throw new Error('PR #125 ist nicht im erwarteten Merge integriert.');
            if (prs[1].state !== 'closed' || prs[1].merged ||
                prs[1].merged_at)
              throw new Error('Der duplizierte PR #124 wurde nicht kontrolliert geschlossen.');
            const expectedPaths = [
              'app/lib/ui/fantasy_character_sheet.dart',
              'app/test/character_sheet_unique_attributes_test.dart',
              'app/test/fantasy_character_sheet_test.dart',
              'app/test/ui_app_test.dart',
              'docs/CHARACTER_SHEET_UNIQUE_ATTRIBUTES_20261023.md',
            ].sort();
            const duplicateFiles = await github.paginate(github.rest.pulls.listFiles, {
              ...repo, pull_number: 124, per_page: 100,
            });
            const actualPaths = duplicateFiles.map(f => f.filename).sort();
            if (JSON.stringify(expectedPaths) !== JSON.stringify(actualPaths))
              throw new Error('PR #124 hat weitere, nicht geprüfte Änderungen.');
            const [mainFile, mergedFile, otherFile] = await Promise.all([
              getText(main.commit.sha), getText(merged.sha), getText(superseded.sha),
            ]);
            if (mainFile.sha !== mainSourceSha ||
                mergedFile.sha !== mainSourceSha ||
                mainFile.text !== mergedFile.text ||
                otherFile.sha !== oldSourceSha)
              throw new Error('Charakterbogen-Quelldateien entsprechen nicht dem geprüften Stand.');
            // #124 removes the same duplicate grid as merged #125.
            // Only the following three improvements are present in main in addition.
            const keyLine = "                    key: ValueKey('sheet-saving-throw-\${ability.id}'),\n";
            const oldCopy = "'Angezeigt werden die gespeicherten Attribute und der Übungsbonus. '";
            const newCopy = "'Die Rettungswurfboni basieren auf bestätigten Attributen und dem Übungsbonus. '";
            const ctorWithKey = 'class _SavingThrowTile extends StatelessWidget {\n  const _SavingThrowTile({\n    super.key,\n';
            const ctorWithoutKey = 'class _SavingThrowTile extends StatelessWidget {\n  const _SavingThrowTile({\n';
            if (!mainFile.text.includes(keyLine) ||
                !mainFile.text.includes(newCopy) ||
                !mainFile.text.includes(ctorWithKey))
              throw new Error('Erwartete Verbesserungen fehlen im gemergten Charakterbogen.');
            const normalized = mainFile.text.replace(keyLine, '')
              .replace(newCopy, oldCopy)
              .replace(ctorWithKey, ctorWithoutKey);
            if (normalized !== otherFile.text)
              throw new Error('PR #124 enthält noch nicht migrierte Anwendungslogik.');
            // Die zwei Varianten besitzen zusätzliche unterschiedliche Tests/Docs.
            // Ihre Original-Commits bleiben über dauerhaft angelegte Tags erhalten.
            for (const t of targets) {
              const branch = await getBranch(t.name);
              if (branch && (branch.protected || branch.commit.sha !== t.sha))
                throw new Error('Branch geschützt oder SHA verändert: ' + t.name);
              await github.rest.git.getCommit({...repo, commit_sha: t.sha});
            }
            const archiveTag = t =>
              'archive/character-sheet-retirement-20261023/' +
              t.name.replaceAll('/', '--');
            for (const t of targets) {
              const ref = 'tags/' + archiveTag(t);
              let existing = null;
              try {existing = (await github.rest.git.getRef({...repo, ref})).data.object.sha;}
              catch (e) {if (e.status !== 404) throw e;}
              if (existing && existing !== t.sha)
                throw new Error('Recovery-Tag zeigt auf einen anderen Commit: ' + ref);
              if (!existing) {
                await github.rest.git.createRef({...repo, ref: 'refs/' + ref, sha: t.sha});
              }
              const saved = (await github.rest.git.getRef({...repo, ref})).data.object.sha;
              if (saved !== t.sha) throw new Error('Recovery-Tag fehlgeschlagen: ' + ref);
            }
            for (const t of targets) {
              if ((await getBranch('main')).commit.sha !== context.sha)
                throw new Error('main wurde während der Bereinigung geändert.');
              const branch = await getBranch(t.name);
              if (!branch) {core.info('Bereits gelöscht, archiviert: ' + t.name); continue;}
              if (branch.protected || branch.commit.sha !== t.sha)
                throw new Error('Branch wurde verändert: ' + t.name);
              await github.rest.git.deleteRef({...repo, ref: 'heads/' + t.name});
              if (await getBranch(t.name)) throw new Error('Löschung nicht bestätigt: ' + t.name);
              core.info('Sicher gelöscht und archiviert: ' + t.name);
            }
            core.info('Charakterbogen-Branch-Bereinigung vollständig abgeschlossen.');
