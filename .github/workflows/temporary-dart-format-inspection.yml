name: Temporary Dart Formatter Inspection
on:
  push:
    branches:
      - feat/srd-opportunity-preflight-20261025
  workflow_dispatch:
jobs:
  format-inspection:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Emit exact formatter output for new test
        run: dart format --output=show app/test/srd_opportunity_attack_rules_test.dart
