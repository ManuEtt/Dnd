name: Chat C cover Dart formatter

on:
  push:
    branches:
      - feat/chat-c/combat-cover-large-text-20261026
    paths:
      - .github/workflows/chat-c-cover-format.yml

permissions:
  contents: read

jobs:
  canonical-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Canonical combat cover UI
        run: dart format --output=show app/lib/ui/fantasy_combat_status.dart
      - name: Canonical combat cover widget tests
        run: dart format --output=show app/test/fantasy_combat_status_test.dart
