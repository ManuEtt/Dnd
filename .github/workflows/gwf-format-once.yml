name: Einmalige Formatierung GWF-Tests
on:
  push:
    branches:
      - feature/great-weapon-style-20261018
    paths:
      - .github/workflows/gwf-format-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Neue Tests offiziell formatieren
        working-directory: app
        run: |
          dart format test/fighter_style_combat_rules_test.dart
          dart format --output=none --set-exit-if-changed lib test
      - name: Korrektur nur im Entwicklungsbranch speichern
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add app/test/fighter_style_combat_rules_test.dart
          if git diff --cached --quiet; then
            echo 'Bereits formatiert'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: format great weapon fighter tests'
          git push origin "HEAD:${GITHUB_REF_NAME}"
