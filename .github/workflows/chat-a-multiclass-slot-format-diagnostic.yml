name: Temporary Multiclass Slot Dart Format Diagnostic
on:
  push:
    branches:
      - fix/chat-a/multiclass-normal-slots-profile-20261106
  workflow_dispatch:
jobs:
  format-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Show exact Dart format diff
        run: |
          cd app
          dart format test/multiclass_spell_slot_class_profile_test.dart
          git --no-pager diff -- test/multiclass_spell_slot_class_profile_test.dart
