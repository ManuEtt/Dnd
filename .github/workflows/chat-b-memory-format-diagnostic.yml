name: Temporary NPC Memory Dart Format Diff
on:
  push:
    branches:
      - feat/chat-b/npc-memory-hidden-name-identity-20261106
    paths:
      - .github/workflows/chat-b-memory-format-diagnostic.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  inspect-dart-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
      - name: Print precise formatting changes
        run: |
          dart format app/test/story_memory_npc_legacy_format_test.dart
          git diff -- app/test/story_memory_npc_legacy_format_test.dart
