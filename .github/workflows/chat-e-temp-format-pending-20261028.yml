name: Temporary Chat E pending-dice format
on:
  push:
    branches:
      - feat/chat-e/savage-attacker-pending-evidence-20261028
permissions:
  contents: read
jobs:
  dart-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.9.2'
      - name: Capture formatter output
        shell: bash
        run: |
          set -euo pipefail
          cd app
          for file in lib/domain/models.dart lib/domain/srd_savage_attacker_pending_hit.dart test/srd_savage_attacker_pending_hit_test.dart; do
            dart format "$file"
            echo "BEGIN_FORMATTED_FILE:$file"
            base64 -w 0 "$file"
            echo
            echo "END_FORMATTED_FILE:$file"
          done
