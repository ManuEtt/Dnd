name: Chat A - einmalige Zauberwirkzeit-Dartformatierung
on:
  push:
    branches:
      - feat/chat-a/spell-casting-time-integrity-20261030
    paths:
      - .github/workflows/chat-a-casting-time-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Offizielle Dart-Formatierung neuer Chat-A-Dateien
        working-directory: app
        run: |
          dart --version
          dart format lib/domain/srd_spell_casting_time_rules.dart test/srd_spell_casting_time_integrity_test.dart
          dart format --output=none --set-exit-if-changed lib/domain/srd_spell_casting_time_rules.dart test/srd_spell_casting_time_integrity_test.dart
      - name: Ausschließlich formatierte Fach- und Testdatei committen
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if ! git diff --quiet -- app/lib/domain/srd_spell_casting_time_rules.dart app/test/srd_spell_casting_time_integrity_test.dart; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- app/lib/domain/srd_spell_casting_time_rules.dart app/test/srd_spell_casting_time_integrity_test.dart
            git commit -m 'style(chat-a): format SRD casting-time rule and regression'
            git push origin HEAD:feat/chat-a/spell-casting-time-integrity-20261030
          fi
