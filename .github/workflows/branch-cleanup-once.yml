name: Einmalige Bereinigung integrierter Entwicklungsbranches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup-once.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: one-time-merged-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: In main enthaltene alte Branches sicher löschen
    runs-on: ubuntu-latest
    steps:
      - name: Stand und offene Pull Requests prüfen und alte Branches löschen
        uses: actions/github-script@v7
        with:
          script: |
            const expectedHeads = new Map([
              ['feature/rabenwacht-voice-act6-20261021', '9b025615192fbbde3e11b980c80ceeb3d53277f7'],
              ['feature/rabenwacht-voice-act6-current-main-20261021', 'cfaed0f52b0e1c93928fe83ad35fa8884c8a9c38'],
              ['feature/rabenwacht-voice-act7-20261021', '517555bed9d57f0fe888a8b14170623c14f20b5a'],
              ['feature/srd-spell-grid-ray-20261021', 'a06c92deeb57535383587ee6a1b100d852e3ddb7'],
              ['feature/srd-spell-inventory-atomic-20261021', '9c06dfdd5e34608dcfc026e902d766e0583dea94'],
              ['feature/srd-spell-inventory-persistence-20261021', 'aa9efc094b64dc41811f67490dae925ff7563635'],
              ['feature/srd-spell-material-components-20261021', 'a10fb87b2b75b556204ab4800c99d0b897b58517'],
              ['feature/srd-spell-range-targeting-20261021', 'ec20149c8eef73e0c93d86e0ab8a9bbb64fc1a93'],
              ['integration/rabenwacht-acts-vi-vii-main-20261021', '12d6cbb379e44d8ec1cc5945330e27446be0ed06']
            ]);
            const { owner, repo } = context.repo;
            const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const mainSha = main.data.commit.sha;
            const openPrs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100
            });
            const safe = [];
            for (const [branch, expectedSha] of expectedHeads) {
              let ref;
              try {
                ref = await github.rest.git.getRef({ owner, repo, ref: 'heads/' + branch });
              } catch (e) {
                if (e.status === 404) {
                  core.info('Branch bereits gelöscht: ' + branch);
                  continue;
                }
                throw e;
              }
              if (ref.data.object.sha !== expectedSha) {
                throw new Error('Branch seit Prüfung verändert, Abbruch: ' + branch);
              }
              if (openPrs.some(pr =>
                pr.head.repo?.full_name === owner + '/' + repo &&
                pr.head.ref === branch
              )) {
                throw new Error('Offener Pull Request, Abbruch: ' + branch);
              }
              const comparison = await github.rest.repos.compareCommits({
                owner, repo, base: mainSha, head: expectedSha
              });
              if (comparison.data.ahead_by !== 0) {
                throw new Error('Nicht vollständig in main integriert, Abbruch: ' + branch);
              }
              safe.push(branch);
            }
            core.info('Alle verbliebenen Branches vorab geprüft: ' + safe.length);
            for (const branch of safe) {
              await github.rest.git.deleteRef({ owner, repo, ref: 'heads/' + branch });
              core.info('Gelöscht: ' + branch);
            }
            core.summary.addHeading('Bereinigung abgeschlossen')
              .addRaw(safe.length + ' bereits integrierte Branches gelöscht.')
              .write();
