name: Chat B temporary NPC identity Dart format diagnostics
on:
  push:
    branches:
      - feat/chat-b/confirmed-npc-note-id-integrity-20261103
jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Print exact Dart format differences
        run: |
          dart format app/lib/story/npc_identity_memory.dart app/test/npc_identity_note_id_integrity_test.dart
          git --no-pager diff -- app/lib/story/npc_identity_memory.dart app/test/npc_identity_note_id_integrity_test.dart
