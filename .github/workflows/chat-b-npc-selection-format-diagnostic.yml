name: Chat B NPC selection temporary Dart format diagnostic
on:
  push:
    branches:
      - feat/chat-b/npc-selection-session-description-20261029
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.9.2'
      - name: Format test and output patch
        run: |
          dart format app/test/npc_story_selection_session_profile_test.dart
          echo 'FORMAT_DIFF_START'
          git diff -- app/test/npc_story_selection_session_profile_test.dart
          echo 'FORMAT_DIFF_END'
