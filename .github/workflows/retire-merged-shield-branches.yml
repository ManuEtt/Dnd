name: Retire verified merged Shield branches
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retire-merged-shield-branches.yml
permissions:
  contents: write
concurrency:
  group: retire-merged-shield-branches
  cancel-in-progress: false
jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.repository == 'ManuEtt/Dnd' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify branch cleanup safety rules
        run: python3 -m unittest discover -s scripts/tests -p test_retire_merged_branches.py -v
      - name: Delete only verified existing merged refs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/retire_merged_branches.py --execute
