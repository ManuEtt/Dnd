name: Chat B one-time delayed story test formatter
on:
  push:
    branches:
      - feat/chat-b/delayed-story-response-restart-20261031
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.9.2'
      - name: Print exact Dart story regression formatting
        run: |
          echo 'CHAT_B_DELAYED_TEST_BEGIN'
          dart format --output=show app/test/ai_story_delayed_sqlite_restart_test.dart
          echo 'CHAT_B_DELAYED_TEST_END'
