name: Temporär Dart-Format Chat E

on:
  push:
    branches:
      - feat/chat-e/acolyte-holy-symbol-choice-20261027

permissions:
  contents: read

jobs:
  dart-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.9.2'
      - name: Formatierten Dart-Quelltext zur Korrektur protokollieren
        shell: bash
        run: |
          cd app
          files=(
            lib/domain/srd_background_package.dart
            lib/ui/srd_background_package_dialog.dart
            test/srd_background_package_dialog_test.dart
            test/srd_background_package_test.dart
          )
          dart format "${files[@]}"
          for file in "${files[@]}"; do
            echo "BEGIN_FORMATTED_FILE:$file"
            base64 -w 0 "$file"
            echo ""
            echo "END_FORMATTED_FILE:$file"
          done
