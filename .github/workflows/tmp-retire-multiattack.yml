name: Retire merged multiattack branch
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-retire-multiattack.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.repository == 'ManuEtt/Dnd' && github.ref == 'refs/heads/main'
    steps:
      - name: Verify exact merged branch then delete its ref
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          from urllib.parse import quote
          repo = "ManuEtt/Dnd"
          branch = "feature/srd-enemy-multiattack-shield-20261020"
          expected = "9156b972d240de4c5a588c09ebb5ac8adeca99ad"
          token = os.environ["GITHUB_TOKEN"]
          assert os.environ["GITHUB_REF"] == "refs/heads/main"
          assert os.environ["GITHUB_REPOSITORY"] == repo
          def req(method, path):
              url = "https://api.github.com/repos/" + repo + "/" + path
              headers = {
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "Wuerfelraunen-merged-branch-retirement",
              }
              with urlopen(Request(url, headers=headers, method=method), timeout=25) as response:
                  data = response.read()
                  return json.loads(data) if data else None
          current_main = req("GET", "branches/main")
          assert current_main["commit"]["sha"] == os.environ["GITHUB_SHA"], "main moved"
          slug = quote(branch, safe="")
          current = req("GET", "branches/" + slug)
          assert current["protected"] is False, "protected ref"
          assert current["commit"]["sha"] == expected, "branch changed"
          compare = req("GET", "compare/main..." + slug)
          assert compare["ahead_by"] == 0 and compare["status"] in (
              "behind", "identical"
          ), "unmerged commits"
          again = req("GET", "branches/" + slug)
          assert again["commit"]["sha"] == expected, "branch changed on recheck"
          req("DELETE", "git/refs/heads/" + quote(branch, safe="/"))
          print("Deleted only verified merged branch:", branch)
          PY
