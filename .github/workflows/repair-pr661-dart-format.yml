name: Temporary Dart formatter repair for PR 661

on:
  push:
    branches:
      - fix/chat-a/level-up-class-profile-validation-20261109b2e
    paths:
      - .github/workflows/repair-pr661-dart-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/chat-a/level-up-class-profile-validation-20261109b2e
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Apply official Dart formatting and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          dart --version
          dart format app/lib/domain/srd_class_level_up.dart
          dart format --output=none --set-exit-if-changed app/lib/domain/srd_class_level_up.dart
          git diff --check
          if git diff --quiet -- app/lib/domain/srd_class_level_up.dart; then
            echo "Expected formatter change was not produced; refusing to create a no-op commit." >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/lib/domain/srd_class_level_up.dart
          git rm -- .github/workflows/repair-pr661-dart-format.yml
          git commit -m "style: apply official Dart formatting to class level-up rules"
          git push origin HEAD:refs/heads/fix/chat-a/level-up-class-profile-validation-20261109b2e
