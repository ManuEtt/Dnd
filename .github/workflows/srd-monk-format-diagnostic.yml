name: Temporary SRD Monk formatting diagnostics
on:
  pull_request:
    paths:
      - 'app/lib/domain/monk_initiative_features.dart'
      - 'app/lib/domain/game_engine.dart'
      - 'app/lib/ui/app.dart'
      - 'app/lib/services/game_controller.dart'
      - 'app/test/monk_uncanny_metabolism_test.dart'
      - '.github/workflows/srd-monk-format-diagnostic.yml'
jobs:
  formatter-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
      - name: Show Dart formatter patch
        working-directory: app
        run: |
          dart format lib/domain/monk_initiative_features.dart lib/domain/game_engine.dart lib/ui/app.dart lib/services/game_controller.dart test/monk_uncanny_metabolism_test.dart
          git diff -- lib/domain/monk_initiative_features.dart lib/domain/game_engine.dart lib/ui/app.dart lib/services/game_controller.dart test/monk_uncanny_metabolism_test.dart
