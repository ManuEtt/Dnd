name: Temporary saved place formatter diff

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/chat-b-place-format-diagnostic.yml'
      - 'app/lib/story/confirmed_place_resume_selection.dart'
      - 'app/test/confirmed_place_resume_terminal_id_test.dart'

jobs:
  show-format-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
      - name: Show formatter diff
        shell: bash
        run: |
          cd app
          dart format lib/story/confirmed_place_resume_selection.dart test/confirmed_place_resume_terminal_id_test.dart
          git diff -- lib/story/confirmed_place_resume_selection.dart test/confirmed_place_resume_terminal_id_test.dart
