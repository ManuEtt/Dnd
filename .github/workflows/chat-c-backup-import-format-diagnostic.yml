name: Chat C Backup-Import-Dart-Format-Diagnose
on:
  push:
    branches:
      - feat/chat-c/backup-import-ime-accessible-20261105
jobs:
  formatter-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Show exact Dart format diff
        run: |
          dart format app/lib/ui/backup_dialogs.dart app/test/backup_import_ime_accessibility_test.dart
          git --no-pager diff -- app/lib/ui/backup_dialogs.dart app/test/backup_import_ime_accessibility_test.dart
