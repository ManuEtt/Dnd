name: Chat B temporary NPC continuity formatter
on:
  push:
    branches:
      - fix/chat-b/npc-continuity-zero-width-20261102

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.9.2'
      - name: Print official Dart formatting
        run: |
          echo 'CHAT_B_NPC_BEGIN_MODULE'
          dart format --output=show app/lib/story/npc_continuity_reader.dart
          echo 'CHAT_B_NPC_END_MODULE'
          echo 'CHAT_B_NPC_BEGIN_TEST'
          dart format --output=show app/test/npc_continuity_zero_width_test.dart
          echo 'CHAT_B_NPC_END_TEST'
