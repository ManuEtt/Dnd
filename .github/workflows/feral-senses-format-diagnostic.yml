name: Feral Senses formatter diagnostic
on:
  push:
    branches:
      - feat/chat-a/ranger-feral-senses-20261027
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Print canonical Dart format diff
        run: |
          dart format app/test/ranger_feral_senses_rules_test.dart
          git diff -- app/test/ranger_feral_senses_rules_test.dart
