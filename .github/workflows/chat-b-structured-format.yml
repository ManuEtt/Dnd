name: Chat B temporary structured NPC formatter
on:
  push:
    branches:
      - fix/chat-b/structured-npc-zero-width-20261102

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.9.2'
      - name: Output official formatted Dart
        run: |
          echo 'CHAT_B_STRUCT_BEGIN_MODULE'
          dart format --output=show app/lib/story/npc_identity_story_payload.dart
          echo 'CHAT_B_STRUCT_END_MODULE'
          echo 'CHAT_B_STRUCT_BEGIN_TEST'
          dart format --output=show app/test/npc_identity_story_zero_width_payload_test.dart
          echo 'CHAT_B_STRUCT_END_TEST'
