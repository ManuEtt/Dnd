name: Chat B NPC resume Dart format diagnostic
on:
  push:
    branches:
      - feat/chat-b/npc-resume-invisible-marks-20261103
    paths:
      - .github/workflows/chat-b-npc-unicode-format-diagnostic.yml
      - app/test/confirmed_npc_resume_invisible_marks_test.dart
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Show exact Dart 3.9 formatter diff
        run: |
          dart format app/test/confirmed_npc_resume_invisible_marks_test.dart
          git diff -- app/test/confirmed_npc_resume_invisible_marks_test.dart
