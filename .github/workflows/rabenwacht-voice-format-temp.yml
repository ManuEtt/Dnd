name: Rabenwacht Fortsetzung Dart Formatter (temporär)

on:
  push:
    branches:
      - feature/rabenwacht-voice-act6-20261021

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Neue Story-Dateien mit Dart formatieren
        run: |
          set -euo pipefail
          cd app
          dart format lib/story/fourteenth_voice_campaign.dart lib/story/rabenwacht_campaign.dart lib/domain/rabenwacht_campaign.dart lib/domain/game_engine.dart test/rabenwacht_fourteenth_voice_act6_test.dart
          dart format --output=none --set-exit-if-changed lib/story/fourteenth_voice_campaign.dart lib/story/rabenwacht_campaign.dart lib/domain/rabenwacht_campaign.dart lib/domain/game_engine.dart test/rabenwacht_fourteenth_voice_act6_test.dart
          cd ..
          git diff --check
      - name: Formatierte Dateien speichern
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/lib/story/fourteenth_voice_campaign.dart app/lib/story/rabenwacht_campaign.dart app/lib/domain/rabenwacht_campaign.dart app/lib/domain/game_engine.dart app/test/rabenwacht_fourteenth_voice_act6_test.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style(story): format Rabenwacht Act VI implementation'
          git push origin HEAD:feature/rabenwacht-voice-act6-20261021
