name: Chat C death save format diagnosis (temporary)
on:
  push:
    branches:
      - feat/chat-c/death-save-actions-large-text-20261030
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Print exact Dart formatter changes
        run: |
          cd app
          dart format lib/ui/death_save_decision_panel.dart test/death_save_actions_large_text_test.dart
          git diff -- lib/ui/death_save_decision_panel.dart test/death_save_actions_large_text_test.dart
