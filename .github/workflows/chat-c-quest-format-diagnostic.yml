name: Chat C Quest Format Diagnostic

on:
  push:
    branches: ['feat/chat-c/quest-board-overflow-hint-20261028']
    paths:
      - 'app/test/fantasy_quest_board_hidden_test.dart'
      - '.github/workflows/chat-c-quest-format-diagnostic.yml'

jobs:
  formatter-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Show exact Dart formatter diff
        run: |
          dart format app/test/fantasy_quest_board_hidden_test.dart
          git diff -- app/test/fantasy_quest_board_hidden_test.dart
