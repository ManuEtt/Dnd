name: Chat C Memory Dialog Format Diagnostic

on:
  push:
    branches: ['fix/chat-c/scrollable-memory-edit-dialogs-20261029']
    paths:
      - '.github/workflows/chat-c-memory-dialog-format-diagnostic.yml'
      - 'app/test/campaign_memory_dialog_large_text_test.dart'

jobs:
  exact-dart-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Show Dart formatter diff
        run: |
          dart format app/test/campaign_memory_dialog_large_text_test.dart
          git diff -- app/test/campaign_memory_dialog_large_text_test.dart
