name: Temporary Hero Shield Dart Formatter
on:
  push:
    branches: [feature/srd-hero-shield-auto-reaction-20261020]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/srd-hero-shield-auto-reaction-20261020
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Format and commit pinned Dart output
        run: |
          set -euo pipefail
          cd app
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test
          cd ..
          git diff --check
          if ! git diff --quiet -- app/lib app/test; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- app/lib app/test
            git commit -m 'style: format SRD hero Shield changes'
            git push origin HEAD:feature/srd-hero-shield-auto-reaction-20261020
          fi
