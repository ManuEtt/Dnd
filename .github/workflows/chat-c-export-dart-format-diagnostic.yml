name: Chat C Export Dart Format Diagnostic
on:
  push:
    branches:
      - feat/chat-c/backup-export-large-text-20261105
jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Show exact formatter changes
        run: |
          dart format app/lib/ui/backup_dialogs.dart app/test/backup_export_large_text_accessibility_test.dart
          git --no-pager diff -- app/lib/ui/backup_dialogs.dart app/test/backup_export_large_text_accessibility_test.dart
