name: Chat B one-time official Dart formatting report
on:
  push:
    branches:
      - feat/chat-b/story-provider-unicode-guard-20261030

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.9.2'
      - name: Print official formatted Chat B test file
        run: |
          echo 'CHAT_B_FORMAT_BEGIN'
          dart format --output=show app/test/ai_story_unicode_format_guard_test.dart
          echo 'CHAT_B_FORMAT_END'
