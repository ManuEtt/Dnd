name: Slow Fall commit format diagnostic
on:
  push:
    branches:
      - feat/chat-a/monk-slow-fall-commit-20261027
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Canonical Dart test changes
        run: |
          dart format app/test/srd_monk_slow_fall_commit_rules_test.dart app/test/srd_monk_slow_fall_commit_storage_test.dart
          git diff -- app/test/srd_monk_slow_fall_commit_rules_test.dart app/test/srd_monk_slow_fall_commit_storage_test.dart
