name: Chat A material format diagnostic
on:
  push:
    branches:
      - feat/chat-a/audited-multi-material-components-20261027
    paths:
      - .github/workflows/chat-a-material-format-diagnostic.yml
jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.9.2'
      - name: Show formatter exact differences
        shell: bash
        run: |
          dart --version
          dart format app/lib/domain/srd_spell_component_rules.dart app/test/srd_multi_material_audit_test.dart
          git diff -- app/lib/domain/srd_spell_component_rules.dart app/test/srd_multi_material_audit_test.dart
