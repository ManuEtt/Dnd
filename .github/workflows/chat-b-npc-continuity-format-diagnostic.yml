name: Chat B NPC continuity Dart format diagnostic (temporary)

on:
  push:
    branches:
      - feat/chat-b/npc-continuity-disambiguation-20261028

permissions:
  contents: read

jobs:
  show-format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Format and print exact diff
        shell: bash
        run: |
          dart format app/lib/story/npc_continuity_reader.dart app/test/npc_continuity_identity_test.dart
          git diff -- app/lib/story/npc_continuity_reader.dart app/test/npc_continuity_identity_test.dart
