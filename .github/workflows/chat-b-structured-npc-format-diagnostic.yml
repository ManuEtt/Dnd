name: Temporary Structured NPC Dart Formatter Diff
on:
  push:
    branches:
      - feat/chat-b/structured-npc-legacy-unicode-20261105
    paths:
      - .github/workflows/chat-b-structured-npc-format-diagnostic.yml
      - app/test/npc_identity_legacy_unicode_payload_test.dart
  pull_request:
    branches: [main]

jobs:
  compare-dart-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
      - name: Show exact Dart 3.9 formatting changes
        run: |
          dart format app/test/npc_identity_legacy_unicode_payload_test.dart
          git diff -- app/test/npc_identity_legacy_unicode_payload_test.dart
