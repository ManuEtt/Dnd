name: Temporary Dart formatter diagnostic

on:
  push:
    branches:
      - fix/chat-a/level-up-class-profile-validation-20261109b2e

permissions:
  contents: read

jobs:
  formatter-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Print formatter output for the affected file
        working-directory: app
        run: dart format --output=show lib/domain/srd_class_level_up.dart
