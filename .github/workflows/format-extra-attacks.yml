name: Temporary Extra-Creature Attack Dart Formatter

on:
  push:
    branches:
      - feature/srd-manual-extra-attacks-20261021
    paths:
      - .github/workflows/format-extra-attacks.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'ManuEtt/Dnd'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/srd-manual-extra-attacks-20261021
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Format new attack and related source code
        shell: bash
        run: |
          set -euo pipefail
          dart format app/lib/domain/models.dart app/lib/domain/srd_initiative_roster_rules.dart app/lib/domain/srd_extra_creature_attack_rules.dart app/lib/domain/game_engine.dart app/lib/services/game_controller.dart app/lib/ui/app.dart app/lib/ui/manual_extra_creature_attack_dialog.dart app/test/srd_extra_creature_attack_test.dart app/test/manual_extra_creature_attack_dialog_test.dart
          dart format --output=none --set-exit-if-changed app/lib/domain/models.dart app/lib/domain/srd_initiative_roster_rules.dart app/lib/domain/srd_extra_creature_attack_rules.dart app/lib/domain/game_engine.dart app/lib/services/game_controller.dart app/lib/ui/app.dart app/lib/ui/manual_extra_creature_attack_dialog.dart app/test/srd_extra_creature_attack_test.dart app/test/manual_extra_creature_attack_dialog_test.dart
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/lib/domain/models.dart app/lib/domain/srd_initiative_roster_rules.dart app/lib/domain/srd_extra_creature_attack_rules.dart app/lib/domain/game_engine.dart app/lib/services/game_controller.dart app/lib/ui/app.dart app/lib/ui/manual_extra_creature_attack_dialog.dart app/test/srd_extra_creature_attack_test.dart app/test/manual_extra_creature_attack_dialog_test.dart
          if ! git diff --cached --quiet; then
            git commit -m 'style(combat): format extra-creature weapon attack'
            git push origin HEAD:feature/srd-manual-extra-attacks-20261021
          fi
