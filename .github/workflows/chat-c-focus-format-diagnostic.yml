name: Chat C Focus Format Diagnostic

on:
  push:
    branches: ['feat/chat-c/shortcut-keyboard-focus-20261028']
    paths:
      - 'app/test/fantasy_pinned_actions_test.dart'
      - '.github/workflows/chat-c-focus-format-diagnostic.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/test/fantasy_pinned_actions_test.dart'
      - '.github/workflows/chat-c-focus-format-diagnostic.yml'

jobs:
  formatter-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Report exact Dart formatter diff
        run: |
          dart format app/test/fantasy_pinned_actions_test.dart
          git diff -- app/test/fantasy_pinned_actions_test.dart
