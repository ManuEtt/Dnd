name: Chat C temporary campaign XP widget diagnostics

on:
  push:
    branches:
      - feat/chat-c/campaign-xp-progress-semantics-20261104

jobs:
  campaign-xp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
      - name: Check formatting and campaign accessibility widgets
        run: |
          cd app
          flutter pub get
          dart format --output=none --set-exit-if-changed lib/ui/fantasy_campaign_dashboard.dart test/fantasy_campaign_xp_accessibility_test.dart
          flutter test test/fantasy_campaign_xp_accessibility_test.dart test/fantasy_campaign_dashboard_test.dart

