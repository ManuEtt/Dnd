name: Einmalige Integration der zwei validierten Korrekturen

on:
  push:
    branches:
      - 'chore/migrate-open-prs-20261026'
    paths:
      - '.github/workflows/one-shot-final-fixes-20261026.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.repository == 'ManuEtt/Dnd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate independently CI-green fixes by exact SHA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branches=(
            'fix/chat-b/disambiguate-recalled-npc-memories-20261026'
            'fix/chat-a/acid-splash-target-identities-20261026'
          )
          numbers=(226 227)
          expected=(
            '81400163b996d9e9f4fe2b796c232ffb63a3f24e'
            'e8740bc4dfc938c74c7eee6c908c5fb0ae028e24'
          )
          for i in "${!branches[@]}"; do
            b="${branches[i]}"
            git fetch --no-tags origin "refs/heads/$b"
            actual=$(git rev-parse FETCH_HEAD)
            [[ "$actual" == "${expected[i]}" ]] || {
              echo "::error::$b changed; aborting instead of overwriting parallel work"
              exit 1
            }
            if ! git merge --no-ff --no-commit "$actual"; then
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              (( ${#conflicts[@]} > 0 )) || exit 1
              for path in "${conflicts[@]}"; do
                case "$path" in
                  README.md|docs/*CHECKPOINT.md|docs/parallel/*CHECKPOINT.md)
                    git checkout --ours -- "$path"
                    git add -- "$path"
                    ;;
                  *)
                    echo "::error::Non-document conflict requires manual review: $path"
                    exit 1
                    ;;
                esac
              done
              [[ -z "$(git diff --name-only --diff-filter=U)" ]] || exit 1
            fi
            git commit -m "Integrate independently green PR #${numbers[i]} preserving original commits"
          done
          python3 scripts/verify_project.py
          python3 scripts/check_domain_boundaries.py
          python3 scripts/srd_coverage.py --json
          python3 -m unittest discover -s scripts/tests -q
          git push origin HEAD:refs/heads/chore/migrate-open-prs-20261026
