# Temporary formatting diagnostic, removed after its one-shot check.
name: SRD capstone format diagnostic
on:
  push:
    branches:
      - feat/chat-a/srd-capstone-level20-20261026
permissions:
  contents: read
jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Format and print unified patch
        run: |
          dart format app/test/srd_class_level_up_test.dart app/test/ui_srd_class_level_up_test.dart
          git diff -- app/test/srd_class_level_up_test.dart app/test/ui_srd_class_level_up_test.dart
