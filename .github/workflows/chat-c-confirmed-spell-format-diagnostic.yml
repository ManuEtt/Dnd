name: Chat C Zauberwirkungsformat-Diagnose (temporär)
on:
  push:
    branches:
      - feat/chat-c/confirmed-spell-effect-ime-20261102
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Format-Änderungen prüfen
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/ui/confirmed_spell_effect_dialog.dart test/confirmed_spell_effect_ime_test.dart
          git diff -- lib/ui/confirmed_spell_effect_dialog.dart test/confirmed_spell_effect_ime_test.dart
