name: Einmalige Deckungs-Formatierung
on:
  push:
    branches:
      - feature/cover-combat-20261019
    paths:
      - '.github/workflows/cover-format-once.yml'
permissions:
  contents: write
jobs:
  format:
    if: "github.event.head_commit.message == 'chore: apply one-time cover formatting'"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cover-combat-20261019
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Formatiere geänderte Dart-Quelldateien
        working-directory: app
        run: |
          dart format lib/domain/cover_rules.dart lib/domain/models.dart lib/domain/game_engine.dart lib/domain/monk_flurry_rules.dart lib/domain/saving_throw_class_actions.dart lib/ui/app.dart test/cover_combat_rules_test.dart
          dart format --output=none --set-exit-if-changed lib test
      - name: Committen, falls nötig
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib app/test
          if ! git diff --cached --quiet; then
            git commit -m "style(cover): apply official Dart formatting"
            git push origin HEAD:feature/cover-combat-20261019
          fi
