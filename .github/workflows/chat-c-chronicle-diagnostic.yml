name: Chat C chronicle TalkBack temporary validation

on:
  push:
    branches:
      - feat/chat-c/chronicle-talkback-20261026
    paths:
      - .github/workflows/chat-c-chronicle-diagnostic.yml

permissions:
  contents: read

jobs:
  chronicle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Generate fantasy graphics
        run: python3 scripts/generate_fantasy_buttons.py
      - name: Resolve Flutter packages
        working-directory: app
        run: flutter pub get
      - name: Print canonical Dart test formatting
        working-directory: app
        run: |
          echo '===CHAT-C-CHRONICLE-FORMATTED-START==='
          dart format --output=show test/fantasy_combat_chronicle_test.dart
          echo '===CHAT-C-CHRONICLE-FORMATTED-END==='
      - name: Analyze chronicle files
        working-directory: app
        run: flutter analyze lib/ui/fantasy_combat_chronicle.dart test/fantasy_combat_chronicle_test.dart
      - name: Run chronicle widget tests
        working-directory: app
        run: flutter test test/fantasy_combat_chronicle_test.dart
