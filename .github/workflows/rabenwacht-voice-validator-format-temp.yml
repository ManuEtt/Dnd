name: Rabenwacht Akt VI Validator Dart Formatter (temporär)

on:
  push:
    branches:
      - feature/rabenwacht-voice-act6-20261021

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Offizielle Dart-Formatierung
        run: |
          cd app
          dart format lib/domain/models.dart test/rabenwacht_fourteenth_voice_act6_test.dart
          dart format --output=none --set-exit-if-changed lib/domain/models.dart test/rabenwacht_fourteenth_voice_act6_test.dart
          cd ..
          git diff --check
      - name: Formatierung speichern
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/domain/models.dart app/test/rabenwacht_fourteenth_voice_act6_test.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style(sequel): format validated Act VI rolls'
          git push origin HEAD:feature/rabenwacht-voice-act6-20261021
