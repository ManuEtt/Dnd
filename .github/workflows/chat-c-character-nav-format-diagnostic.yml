name: Chat C Character Navigation Format Diagnostic

on:
  push:
    branches: ['feat/chat-c/character-nav-large-text-20261029']
    paths:
      - '.github/workflows/chat-c-character-nav-format-diagnostic.yml'
      - 'app/lib/ui/fantasy_character_overview.dart'
      - 'app/test/fantasy_character_quick_navigation_large_text_test.dart'

jobs:
  exact-dart-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Show Dart formatter diff
        run: |
          dart format app/lib/ui/fantasy_character_overview.dart app/test/fantasy_character_quick_navigation_large_text_test.dart
          git diff -- app/lib/ui/fantasy_character_overview.dart app/test/fantasy_character_quick_navigation_large_text_test.dart
