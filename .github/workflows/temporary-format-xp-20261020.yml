name: Temporäre Formatprüfung XP-Integration

on:
  push:
    branches:
      - integration/legacy-branches-safe-20261020
  pull_request:
    branches:
      - main
    paths:
      - 'app/lib/domain/experience_progression.dart'
      - 'app/test/experience_progression_test.dart'
      - '.github/workflows/temporary-format-xp-20261020.yml'

permissions:
  contents: write

jobs:
  dart-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
      - name: Dart Dateien formatieren und Änderungen einchecken
        run: |
          cd app
          dart format lib/domain/experience_progression.dart test/experience_progression_test.dart
          cd ..
          if ! git diff --quiet -- app/lib/domain/experience_progression.dart app/test/experience_progression_test.dart; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/lib/domain/experience_progression.dart app/test/experience_progression_test.dart
            git commit -m "style: dart format XP integration"
            git push
          fi
