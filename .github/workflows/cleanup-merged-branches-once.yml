name: Einmalige sichere Branch-Bereinigung
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Nur nach PR-Merge und unveraendertem SHA loeschen
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const targets = [
              {
                "name": "feature/rabenwacht-alternative-checks-20261021",
                "sha": "a360db611f88a6fdf235dd1de8c01e2e7a331d50",
                "prs": [
                  66
                ]
              },
              {
                "name": "feature/rabenwacht-branching-story-20261021",
                "sha": "1f0b5744cc1dc37e20a6407cbf276628cae636ac",
                "prs": [
                  61
                ]
              },
              {
                "name": "feature/rabenwacht-gedenkstein-20261021",
                "sha": "84e6ee66328290383ae167a19f2ceb13bb627dfc",
                "prs": [
                  64
                ]
              },
              {
                "name": "feature/rabenwacht-gedenkstein-main-20261021",
                "sha": "dfce7883d2838b0ef1a586f138e0faff0fa87cf5",
                "prs": [
                  64
                ]
              },
              {
                "name": "feature/rabenwacht-namenchor-main-20261021",
                "sha": "11100b76847f92aa7ca046701e61746a413f793e",
                "prs": [
                  67
                ]
              },
              {
                "name": "feature/rabenwacht-npc-memory-20261021",
                "sha": "8869e3099198e9323b3d773a01e0bc98b1137923",
                "prs": [
                  65
                ]
              },
              {
                "name": "feature/rabenwacht-npc-memory-main-20261021",
                "sha": "96452e8d5e325210f3596bd7fa29fda032cfceaa",
                "prs": [
                  65
                ]
              },
              {
                "name": "feature/rabenwacht-stumme-strophe-20261021",
                "sha": "6aa0b140045112be22966ed589847185cdf76fb2",
                "prs": [
                  67
                ]
              },
              {
                "name": "feature/rules-story-boundaries-20261021",
                "sha": "e51e73c6a4b6e80c8b2b2b603b61fed1a7718079",
                "prs": [
                  69
                ]
              },
              {
                "name": "feature/separate-rules-and-story-20261021",
                "sha": "da1fbb6369288455e5804b36c190f9ecf105a8bd",
                "prs": [
                  69,
                  71
                ]
              },
              {
                "name": "feature/srd-acid-splash-aoe-20261020",
                "sha": "1b20f34b3ff8a953b9834dabe857438b76ab7087",
                "prs": [
                  57
                ]
              },
              {
                "name": "feature/srd-countable-requirements-20261020",
                "sha": "ef285375a6d586be6ae968f942ce957d23f97a62",
                "prs": [
                  53
                ]
              },
              {
                "name": "feature/srd-fire-bolt-combat-20261020",
                "sha": "6ea66c10d4f4610a64f88ca02d1e950cf85f907f",
                "prs": [
                  55
                ]
              },
              {
                "name": "feature/srd-manual-extra-attacks-20261021",
                "sha": "80b27611834a55207f1246fe89920409c02e070c",
                "prs": [
                  70,
                  71
                ]
              },
              {
                "name": "feature/srd-manual-extra-attacks-rebased-20261021",
                "sha": "7a493afdd27d9af466286e2ebe00f46399b8f91a",
                "prs": [
                  70,
                  71
                ]
              },
              {
                "name": "feature/srd-manual-multi-turn-queue-20261021",
                "sha": "1284a33ef1c7b723281fe4b15678d26e8520b1f2",
                "prs": [
                  60
                ]
              },
              {
                "name": "feature/srd-multi-initiative-roster-20261020",
                "sha": "0c099877585224ea551cea6bad6eea6c5fa4d3f6",
                "prs": [
                  59
                ]
              },
              {
                "name": "feature/srd-persistent-area-creatures-20261020",
                "sha": "af794e130177f33a50e2f01de86b679a61537462",
                "prs": [
                  58
                ]
              },
              {
                "name": "feature/srd-sacred-flame-save-20261020",
                "sha": "26bc034f0c148551828572de74c02f7d6bf6cd04",
                "prs": [
                  56
                ]
              },
              {
                "name": "feature/srd-spell-catalog-preflight-20261020",
                "sha": "288e10b2424ef71faab8c18cd125eb3265657dce",
                "prs": [
                  54
                ]
              },
              {
                "name": "integration/rules-story-apis-20261021",
                "sha": "797d7ae9e2b88bdfe7ab42974a048999b20155e9",
                "prs": [
                  71
                ]
              },
              {
                "name": "integration/srd-extra-attacks-main-20261021",
                "sha": "8928ea7db247d0bad1c1f06817448d20370a7003",
                "prs": [
                  70,
                  71
                ]
              },
              {
                "name": "story/rabenwacht-fourteenth-voice-20261021",
                "sha": "2999cb103875df8557a74535b572d8fad24b2b5d",
                "prs": [
                  68
                ]
              }
            ];
            const cache = new Map();
            async function hasMerged(num) {
              if (cache.has(num)) return cache.get(num);
              const r = await github.rest.pulls.get({owner, repo, pull_number: num});
              const valid = r.data.merged === true && !!r.data.merged_at && r.data.base.ref === 'main';
              cache.set(num, valid);
              return valid;
            }
            let removed = 0, deferred = 0, conflicts = 0;
            const notes = [];
            for (const target of targets) {
              if (target.name === 'main') { conflicts++; continue; }
              try {
                const proofs = await Promise.all(target.prs.map(hasMerged));
                if (proofs.some(p => !p)) {
                  deferred++;
                  notes.push('DEFER: '+target.name+' requires merged PRs '+target.prs.join(','));
                  continue;
                }
                const current = await github.rest.repos.getBranch({owner, repo, branch: target.name});
                if (current.data.protected || current.data.commit.sha !== target.sha) {
                  conflicts++;
                  notes.push('SKIP protected or changed: '+target.name);
                  continue;
                }
                await github.rest.git.deleteRef({owner, repo, ref: 'heads/'+target.name});
                removed++;
                notes.push('DELETED '+target.name);
              } catch (error) {
                if (error.status === 404) {
                  notes.push('ALREADY ABSENT '+target.name);
                } else {
                  conflicts++;
                  notes.push('ERROR '+target.name+': '+String(error.message).slice(0,140));
                }
              }
            }
            core.info(notes.join('\n'));
            core.summary.addHeading('Branch-Bereinigung').addRaw('Deleted: '+removed+', pending PRs: '+deferred+', skipped/errors: '+conflicts).write();
            if (conflicts) core.setFailed('Review changed/protected branches or API permission errors.');
