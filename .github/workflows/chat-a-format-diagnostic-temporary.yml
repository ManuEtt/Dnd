name: Chat A temporary formatter diagnostics
on:
  push:
    branches:
      - fix/chat-a/acid-splash-target-identities-20261026
jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Print exact formatter diff
        run: |
          dart format app/test/acid_splash_rules_test.dart
          git diff -- app/test/acid_splash_rules_test.dart
