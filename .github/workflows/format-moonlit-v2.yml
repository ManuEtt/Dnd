name: Format Moonlit V2 UI
on:
  push:
    branches:
      - feature/moonlit-scenery-v2-20261019
    paths:
      - '.github/workflows/format-moonlit-v2.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/moonlit-scenery-v2-20261019
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Apply official Dart format
        run: |
          dart format app/lib/ui/fantasy_landscape.dart app/lib/ui/fantasy_ui.dart app/lib/ui/fantasy_character_sheet.dart app/test/moonlit_scenery_test.dart
      - name: Commit format-only changes
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/lib/ui/fantasy_landscape.dart app/lib/ui/fantasy_ui.dart app/lib/ui/fantasy_character_sheet.dart app/test/moonlit_scenery_test.dart
            git commit -m 'style(ui): use official Dart formatting for moonlit scenery'
            git push origin HEAD:feature/moonlit-scenery-v2-20261019
          fi
