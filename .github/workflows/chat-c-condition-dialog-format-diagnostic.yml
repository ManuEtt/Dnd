name: Chat C Zustandsdialog-Formatdiagnose (temporär)
on:
  push:
    branches:
      - feat/chat-c/condition-effect-dialog-ime-20261101
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Dart-Format mit exaktem Diff
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/ui/condition_effect_dialog.dart test/condition_effect_dialog_ime_test.dart
          git diff -- lib/ui/condition_effect_dialog.dart test/condition_effect_dialog_ime_test.dart
