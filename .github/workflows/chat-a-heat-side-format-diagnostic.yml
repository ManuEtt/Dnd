name: Chat A heat-side formatter diagnostic (temporary)
on:
  push:
    branches:
      - feat/chat-a/wall-fire-heat-side-preflight-20261029

jobs:
  dart-format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Print official formatter diff for hot-side test
        run: |
          cd app
          dart format test/srd_wall_of_fire_heat_side_rules_test.dart
          git diff -- test/srd_wall_of_fire_heat_side_rules_test.dart
