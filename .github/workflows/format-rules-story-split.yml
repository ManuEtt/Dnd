name: Temporary Rules Story Split Dart Formatter

on:
  push:
    branches:
      - feature/rules-story-boundaries-20261021
    paths:
      - .github/workflows/format-rules-story-split.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'ManuEtt/Dnd'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rules-story-boundaries-20261021
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Format extracted story modules and tests
        shell: bash
        run: |
          set -euo pipefail
          dart format app/lib/domain/game_engine.dart app/lib/story app/test/rules_story_separation_test.dart
          dart format --output=none --set-exit-if-changed app/lib/domain/game_engine.dart app/lib/story app/test/rules_story_separation_test.dart
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/lib/domain/game_engine.dart app/lib/story app/test/rules_story_separation_test.dart
          if ! git diff --cached --quiet; then
            git commit -m 'style(architecture): format extracted story and guard with pinned Dart SDK'
            git push origin HEAD:feature/rules-story-boundaries-20261021
          fi
