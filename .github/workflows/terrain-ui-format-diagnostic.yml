name: Terrain UI format diagnostic
on:
  push:
    branches:
      - feat/chat-a/confirmed-climb-swim-20261027
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Print Dart formatter patch
        run: |
          dart format app/test/srd_terrain_movement_ui_test.dart
          git diff -- app/test/srd_terrain_movement_ui_test.dart
