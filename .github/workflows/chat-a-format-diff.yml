name: Chat A Dart-Format-Diagnose
on:
  pull_request:
    paths:
      - 'app/lib/domain/srd_spell_duration_rules.dart'
      - 'app/test/srd_spell_duration_rules_test.dart'
      - '.github/workflows/chat-a-format-diff.yml'

jobs:
  show-format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Exakte Dart-Formatkorrektur anzeigen
        shell: bash
        run: |
          dart format app/lib/domain/srd_spell_duration_rules.dart app/test/srd_spell_duration_rules_test.dart
          git --no-pager diff -- app/lib/domain/srd_spell_duration_rules.dart app/test/srd_spell_duration_rules_test.dart
