name: Chat B temporary Unicode Dart formatter diagnostic
on:
  push:
    branches:
      - fix/chat-b/story-provider-invisible-unicode-20261102
jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Print exact Dart formatter diff
        run: |
          dart format app/test/ai_story_invisible_unicode_test.dart
          git --no-pager diff -- app/test/ai_story_invisible_unicode_test.dart
