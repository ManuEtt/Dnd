name: Chat B Dart Formatter Diagnostic (temporary)
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/chat-b/npc-narrator-legacy-unicode-main-sync-20261105
    paths:
      - .github/workflows/chat-b-narrator-format-diagnostic.yml
      - app/test/npc_narrator_legacy_unicode_test.dart

jobs:
  show-formatter-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
      - name: Format single regression test and print exact diff
        run: |
          dart format app/test/npc_narrator_legacy_unicode_test.dart
          git diff -- app/test/npc_narrator_legacy_unicode_test.dart
