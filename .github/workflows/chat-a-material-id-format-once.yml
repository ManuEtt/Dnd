name: Chat A - einmalige Material-ID-Dartformatierung
on:
  push:
    branches:
      - feat/chat-a/spell-material-id-integrity-20261030
    paths:
      - .github/workflows/chat-a-material-id-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Formatiere nur die betroffene Chat-A-Domaindatei
        working-directory: app
        run: |
          dart --version
          dart format lib/domain/srd_spell_inventory_rules.dart
          dart format --output=none --set-exit-if-changed lib/domain/srd_spell_inventory_rules.dart
      - name: Committe nur die offizielle Formatierung
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if ! git diff --quiet -- app/lib/domain/srd_spell_inventory_rules.dart; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- app/lib/domain/srd_spell_inventory_rules.dart
            git commit -m 'style(chat-a): apply Dart 3.9 formatting to material ID guard'
            git push origin HEAD:feat/chat-a/spell-material-id-integrity-20261030
          fi
