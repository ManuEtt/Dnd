name: Chat A Eldritch Blast Regression

on:
  push:
    paths:
      - 'app/lib/domain/srd_eldritch_blast_rules.dart'
      - 'app/lib/domain/game_engine.dart'
      - 'app/test/srd_eldritch_blast_rules_test.dart'
      - 'app/test/srd_eldritch_blast_encounter_test.dart'
      - '.github/workflows/chat-a-eldritch-regression.yml'
  pull_request:
    paths:
      - 'app/lib/domain/srd_eldritch_blast_rules.dart'
      - 'app/lib/domain/game_engine.dart'
      - 'app/test/srd_eldritch_blast_rules_test.dart'
      - 'app/test/srd_eldritch_blast_encounter_test.dart'
      - '.github/workflows/chat-a-eldritch-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eldritch-attack-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: SQLite fuer Linux-Tests installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
      - name: Flutter-Abhaengigkeiten installieren
        working-directory: app
        run: flutter pub get
      - name: Chat-A-Regeldateien formatieren pruefen
        working-directory: app
        run: |
          dart format lib/domain/srd_eldritch_blast_rules.dart lib/domain/game_engine.dart test/srd_eldritch_blast_rules_test.dart test/srd_eldritch_blast_encounter_test.dart
          git --no-pager diff --exit-code -- lib/domain/srd_eldritch_blast_rules.dart lib/domain/game_engine.dart test/srd_eldritch_blast_rules_test.dart test/srd_eldritch_blast_encounter_test.dart
      - name: Flutter-Code analysieren
        working-directory: app
        run: flutter analyze
      - name: Eldritch-Regel-/SQLite-Regression gezielt ausfuehren
        working-directory: app
        run: flutter test test/srd_eldritch_blast_rules_test.dart test/srd_eldritch_blast_encounter_test.dart
