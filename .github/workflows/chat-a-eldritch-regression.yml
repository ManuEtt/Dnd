name: SRD Eldritch Blast Regression

on:
  push:
    branches: [main]
    paths:
      - 'app/lib/domain/srd_eldritch_blast_rules.dart'
      - 'app/lib/domain/game_engine.dart'
      - 'app/test/srd_eldritch_blast_rules_test.dart'
      - 'app/test/srd_eldritch_blast_encounter_test.dart'
      - '.github/workflows/chat-a-eldritch-regression.yml'
  pull_request:
    paths:
      - 'app/lib/domain/srd_eldritch_blast_rules.dart'
      - 'app/lib/domain/game_engine.dart'
      - 'app/test/srd_eldritch_blast_rules_test.dart'
      - 'app/test/srd_eldritch_blast_encounter_test.dart'
      - '.github/workflows/chat-a-eldritch-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: srd-eldritch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eldritch-attack-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: SQLite fuer Linux-Tests installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
      - name: Flutter-Abhaengigkeiten installieren
        working-directory: app
        run: flutter pub get
      - name: Regeldateien ohne Arbeitsbaumänderung auf Dart-Formatierung prüfen
        working-directory: app
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/domain/srd_eldritch_blast_rules.dart \
            lib/domain/game_engine.dart \
            test/srd_eldritch_blast_rules_test.dart \
            test/srd_eldritch_blast_encounter_test.dart \
            lib/domain/srd_sorcerous_restoration_rules.dart \
            lib/domain/class_resource_rules.dart \
            lib/domain/rest_rules.dart \
            test/srd_sorcerous_restoration_rules_test.dart
      - name: Geaenderte Regeldateien und Tests analysieren
        working-directory: app
        run: |
          flutter analyze lib/domain/srd_eldritch_blast_rules.dart lib/domain/game_engine.dart test/srd_eldritch_blast_rules_test.dart test/srd_eldritch_blast_encounter_test.dart
      - name: Eldritch-Regel-/SQLite-Regression gezielt ausfuehren
        working-directory: app
        run: flutter test test/srd_eldritch_blast_rules_test.dart test/srd_eldritch_blast_encounter_test.dart
