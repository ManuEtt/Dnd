name: Monk Slow Fall Dart formatter diagnostic
on:
  push:
    branches:
      - feat/chat-a/monk-slow-fall-20261027
permissions:
  contents: read
jobs:
  dart-format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Print exact Slow Fall rule test formatter changes
        run: |
          dart format app/test/srd_monk_slow_fall_rules_test.dart
          git diff -- app/test/srd_monk_slow_fall_rules_test.dart
