name: Chat C Material-Dart-Format-Diagnose
on:
  push:
    branches:
      - feat/chat-c/material-inventory-id-ui-20261105
jobs:
  show-format-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Show exact Dart format diff
        run: |
          dart format app/test/srd_material_inventory_dialog_test.dart
          git --no-pager diff -- app/test/srd_material_inventory_dialog_test.dart
