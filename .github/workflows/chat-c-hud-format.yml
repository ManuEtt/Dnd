name: Chat C HUD formatter diagnostic

on:
  push:
    branches:
      - feat/chat-c/accessible-status-hud-20261025
    paths:
      - .github/workflows/chat-c-hud-format.yml

permissions:
  contents: read

jobs:
  print-canonical-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Print canonical HUD widget tests
        run: dart format --output=show app/test/fantasy_adventure_hud_test.dart
