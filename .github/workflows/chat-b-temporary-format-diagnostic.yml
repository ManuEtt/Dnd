name: Temporary NPC Story Dart format diagnostic
on:
  push:
    branches:
      - fix/chat-b/npc-identity-session-guard-20261113
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Show exact Dart formatter changes
        working-directory: app
        run: |
          dart format test/npc_identity_session_bounds_test.dart
          git --no-pager diff -- test/npc_identity_session_bounds_test.dart
