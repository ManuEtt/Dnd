name: Temporary SRD Spell Feature Formatter

on:
  push:
    branches:
      - feature/srd-spell-catalog-preflight-20261020
    paths:
      - .github/workflows/format-spell-feature.yml

permissions:
  contents: write

jobs:
  spell-format:
    if: github.repository == 'ManuEtt/Dnd'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/srd-spell-catalog-preflight-20261020
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Format only new SRD spell Dart files
        run: |
          set -euo pipefail
          dart format app/lib/data/srd_spell_catalog_loader.dart app/lib/domain/srd_spell_catalog.dart app/lib/domain/srd_spell_preflight_rules.dart app/test/srd_spell_catalog_preflight_test.dart
          dart format --output=none --set-exit-if-changed app/lib/data/srd_spell_catalog_loader.dart app/lib/domain/srd_spell_catalog.dart app/lib/domain/srd_spell_preflight_rules.dart app/test/srd_spell_catalog_preflight_test.dart
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/lib/data/srd_spell_catalog_loader.dart app/lib/domain/srd_spell_catalog.dart app/lib/domain/srd_spell_preflight_rules.dart app/test/srd_spell_catalog_preflight_test.dart
          if ! git diff --cached --quiet; then
            git commit -m 'style(spells): apply official Dart 3.9.2 formatter'
            git push origin HEAD:feature/srd-spell-catalog-preflight-20261020
          fi
