name: Chat B continuity formatter diagnostic
on:
  push:
    branches:
      - feat/chat-b/npc-continuity-legacy-marks-20261103
    paths:
      - .github/workflows/chat-b-continuity-formatter-probe.yml
      - app/test/confirmed_npc_continuity_legacy_marks_test.dart
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Show exact Dart formatter diff
        run: |
          dart format app/test/confirmed_npc_continuity_legacy_marks_test.dart
          git diff -- app/test/confirmed_npc_continuity_legacy_marks_test.dart
