name: Chat A Atomic Long Jump Format Diagnostic
on:
  push:
    branches:
      - feat/chat-a/long-jump-atomic-integration-20261027
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
      - name: Show canonical Dart formatting delta without writing to GitHub
        run: |
          dart format app/lib/domain/game_engine.dart app/lib/services/game_controller.dart app/test/srd_long_jump_atomic_storage_test.dart
          echo '=== CHAT A FORMAT PATCH START ==='
          git diff --unified=0 -- app/lib/domain/game_engine.dart app/lib/services/game_controller.dart app/test/srd_long_jump_atomic_storage_test.dart
          echo '=== CHAT A FORMAT PATCH END ==='
