name: Chat B place-memory Dart formatter diagnostic
on:
  push:
    branches:
      - feat/chat-b/place-recall-id-continuity-20261105
    paths:
      - .github/workflows/chat-b-place-memory-format-probe.yml
      - app/lib/story/story_memory_engine.dart
      - app/test/memory_recall_place_identity_test.dart
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Print the exact Dart 3.9 formatting patch
        run: |
          dart format app/lib/story/story_memory_engine.dart app/test/memory_recall_place_identity_test.dart
          git diff -- app/lib/story/story_memory_engine.dart app/test/memory_recall_place_identity_test.dart
