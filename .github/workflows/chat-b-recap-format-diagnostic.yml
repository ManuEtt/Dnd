name: Chat B – Dart-Format-Diagnose (temporär)

on:
  push:
    branches:
      - feat/chat-b/recap-npc-id-boundary-20261028

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4
      - name: Flutter 3.35.7 installieren
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Formatierten Diff ausgeben
        shell: bash
        run: |
          cd app
          dart format test/session_recap_npc_identity_test.dart
          git diff -- test/session_recap_npc_identity_test.dart
