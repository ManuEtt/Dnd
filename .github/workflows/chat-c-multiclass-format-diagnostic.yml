name: Chat C Mehrklassen Dart-Formatdiagnose (temporär)
on:
  push:
    branches:
      - feat/chat-c/multiclass-dialog-large-text-ime-20261101
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Offiziellen Formatter und Diff zeigen
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/ui/multiclass_selection_dialog.dart test/multiclass_dialog_large_text_ime_test.dart
          git diff -- lib/ui/multiclass_selection_dialog.dart test/multiclass_dialog_large_text_ime_test.dart
