name: Temporary Slow Fall Dart Format Diagnostic
on:
  push:
    branches:
      - feat/chat-a/monk-slow-fall-class-preflight-20261105
  workflow_dispatch:
jobs:
  format-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Show exact Dart format diff
        run: |
          cd app
          dart format test/srd_monk_slow_fall_class_preflight_test.dart
          git --no-pager diff -- test/srd_monk_slow_fall_class_preflight_test.dart
