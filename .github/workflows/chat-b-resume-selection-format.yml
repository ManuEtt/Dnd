name: Chat B temporary NPC resume selector Dart formatter
on:
  push:
    branches:
      - feat/chat-b/confirmed-npc-resume-selection-20261102
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.9.2'
      - name: Print official Dart formatting
        run: |
          echo 'CHAT_B_RESUME_BEGIN_MODULE'
          dart format --output=show app/lib/story/confirmed_npc_resume_selection.dart
          echo 'CHAT_B_RESUME_END_MODULE'
          echo 'CHAT_B_RESUME_BEGIN_TEST'
          dart format --output=show app/test/confirmed_npc_resume_selection_test.dart
          echo 'CHAT_B_RESUME_END_TEST'
