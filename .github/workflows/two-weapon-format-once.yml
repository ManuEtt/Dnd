name: Einmalige Zwei-Waffen-Dart-Formatierung

on:
  push:
    branches:
      - feature/two-weapon-fighting-20261018

permissions:
  contents: write

jobs:
  formatter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Branch auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Offizielles Dart-SDK bereitstellen
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Projektdateien formatieren
        working-directory: app
        run: |
          set -euo pipefail
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test
      - name: Ausschließlich Dart-Formatänderungen übernehmen
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo 'Bereits vollständig formatiert.'
            exit 0
          fi
          if git diff --name-only | grep -vE '^app/(lib|test)/.*\.dart$'; then
            echo 'Abbruch: unerwartete Dateiaenderung.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/lib app/test
          git commit -m 'style: format two-weapon implementation with Dart 3.35.7'
          git push origin HEAD:feature/two-weapon-fighting-20261018
