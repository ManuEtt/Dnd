name: Einmalige Barden- und Schurken-Formatierung
on:
  push:
    branches:
      - feature/bard-rogue-skill-passives-20261019
    paths:
      - '.github/workflows/skill-passives-format-once.yml'
permissions:
  contents: write
jobs:
  format:
    if: "github.event.head_commit.message == 'chore: format skill passives once'"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bard-rogue-skill-passives-20261019
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Offizieller Dart-Formatter
        working-directory: app
        run: |
          dart format lib/domain/skill_check_passives.dart lib/domain/character_rule_engine.dart lib/domain/rabenwacht_campaign.dart lib/domain/models.dart lib/domain/game_engine.dart lib/domain/srd_class_feature_catalog.dart test/skill_check_passives_test.dart
          dart format --output=none --set-exit-if-changed lib test
      - name: Commit nur bei Änderung
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib app/test
          if ! git diff --cached --quiet; then
            git commit -m "style(srd): apply official Dart formatting"
            git push origin HEAD:feature/bard-rogue-skill-passives-20261019
          fi
