name: One-time Fireball reset branch cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-fireball-reset-branch-20261021.yml'
permissions:
  contents: write
jobs:
  retire:
    if: github.repository == 'ManuEtt/Dnd' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Delete only validated already-merged Fireball branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo='ManuEtt/Dnd'
          name='feature/fireball-preview-reset-20261021'
          expected='afc38ff3a6bd606b2c96928d4f1d7da14bb169a3'
          main=$(gh api "repos/$repo/branches/main" --jq '.commit.sha')
          [ "$main" = "$GITHUB_SHA" ] || { echo 'main changed; fail closed'; exit 1; }
          actual=$(gh api "repos/$repo/branches/$name" --jq '.commit.sha')
          [ "$actual" = "$expected" ] || { echo 'feature head changed; fail closed'; exit 1; }
          protected=$(gh api "repos/$repo/branches/$name" --jq '.protected')
          [ "$protected" = 'false' ] || { echo 'protected; fail closed'; exit 1; }
          ahead=$(gh api "repos/$repo/compare/main...$name" --jq '.ahead_by')
          [ "$ahead" = '0' ] || { echo 'unmerged commits; fail closed'; exit 1; }
          [ "$(gh api "repos/$repo/branches/$name" --jq '.commit.sha')" = "$expected" ] || exit 1
          gh api -X DELETE "repos/$repo/git/refs/heads/$name"
          echo "Retired merged feature branch: $name"
