name: Android Alpha Build
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Generate Android host and apply microphone permissions
        run: bash tool/setup_android.sh
      - name: Flutter dependencies
        run: flutter pub get
      - name: Dart analyzer
        run: flutter analyze
      - name: Flutter unit tests
        run: flutter test
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Backend pure logic tests
        run: cd backend && node --experimental-strip-types --test test/*.test.mjs
      - name: Backend install and build
        run: cd backend && npm install --no-audit --no-fund && npm run build
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: aetheria-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
