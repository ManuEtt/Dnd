name: Android-Alpha bauen

on:
  push:
    paths:
      - 'app/**'
      - 'backend/**'
      - '.github/workflows/android-build.yml'
      - 'scripts/**'
  pull_request:
    paths:
      - 'app/**'
      - 'backend/**'
      - '.github/workflows/android-build.yml'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-alpha-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-apk:
    name: Prüfen und Debug-APK erstellen
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Fantasy-Buttons ohne externe Abhängigkeiten generieren
        run: python3 scripts/generate_fantasy_buttons.py
      - name: Upload-Struktur und Projektdateien prüfen
        run: |
          if [ -f scripts/verify_project.py ]; then
            python3 scripts/verify_project.py .
          elif [ -f Dnd/scripts/verify_project.py ]; then
            python3 Dnd/scripts/verify_project.py .
          else
            echo "Projektdateien fehlen: ZIP entpacken und app/, backend/, scripts/ sowie .github/ direkt in die Repositorywurzel übertragen."
            exit 1
          fi
      - name: Regel- und Story-Modulgrenzen prüfen
        run: python3 scripts/check_domain_boundaries.py
      - name: SRD-5.2.1-Anforderungsregister prüfen
        run: python3 scripts/srd_coverage.py --json
      - name: Paket- und Strukturtests ausführen
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Java 17 installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter 3.35.7 installieren
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Node.js 22.14.0 installieren
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Backend-Abhängigkeiten installieren
        working-directory: backend
        run: npm ci
      - name: Backend-Typen prüfen
        working-directory: backend
        run: npm run typecheck
      - name: Backend bauen
        working-directory: backend
        run: npm run build
      - name: Backend testen
        working-directory: backend
        run: npm test
      - name: SQLite für Linux-Tests installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
      - name: Flutter-Abhängigkeiten installieren
        working-directory: app
        run: flutter pub get
      - name: TEMP Formatquelle Klassenausruestung
        working-directory: app
        run: |
          dart format lib/ui/character_editor.dart
          echo "FORMAT_BEGIN:lib/ui/character_editor.dart"
          base64 -w0 lib/ui/character_editor.dart
          echo ""
          echo "FORMAT_END:lib/ui/character_editor.dart"
      - name: Dart-Formatierung prüfen
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Flutter-Code analysieren
        working-directory: app
        run: flutter analyze
      - name: Fantasy-Spiel-Dialoge gezielt testen
        working-directory: app
        run: |
          flutter test test/fantasy_game_dialog_actions_test.dart test/ui_ability_assignment_test.dart test/ui_equipment_loadout_test.dart

      - name: Flutter-Tests ausführen
        working-directory: app
        env:
          RUN_BACKEND_SMOKE: '1'
        run: flutter test
      - name: Android-Kommandozeilenwerkzeuge installieren
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Android-Plattformen und Buildwerkzeuge installieren
        run: bash scripts/install_android_sdk_packages.sh
      - name: Android-Debug-APK bauen
        working-directory: app
        run: |
          chmod +x android/gradlew
          flutter build apk --debug
      - name: Native Dateisicherungslogik testen
        working-directory: app/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Kleine Alpha-APKs bauen
        working-directory: app
        run: |
          mkdir -p build/alpha
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk build/alpha/app-arm64-v8a-alpha.apk
          flutter build apk --release --target-platform android-arm
          cp build/app/outputs/flutter-apk/app-release.apk build/alpha/app-armeabi-v7a-alpha.apk
          flutter build apk --release --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-release.apk build/alpha/app-x86_64-alpha.apk
      - name: Kleine Alpha-APKs bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: lebendiger-spielleiter-alpha-kleine-apks
          path: app/build/alpha/app-*-alpha.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: lebendiger-spielleiter-android-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Vollständiges versioniertes Alpha-Release vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_alpha_release.py "$RUNNER_TEMP/wuerfelraunen-release" \
            --commit "$GITHUB_SHA" \
            --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Vollständiges Alpha-Release bereitstellen (nur bei erfolgreichen Builds)
        uses: actions/upload-artifact@v4
        with:
          name: wuerfelraunen-alpha-${{ github.run_number }}-${{ github.sha }}
          path: ${{ runner.temp }}/wuerfelraunen-release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Vollständigen Quellcode-Checkpoint erstellen (auch bei fehlgeschlagenem Build)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wuerfelraunen-source"
          python3 scripts/package_project.py "$RUNNER_TEMP/wuerfelraunen-source/Wuerfelraunen_${GITHUB_SHA:0:8}_Source_Checkpoint.zip" --layout root
          {
            echo "Quellcode-Checkpoint, Commit $GITHUB_SHA"
            echo "GitHub-Lauf $GITHUB_RUN_ID"
            echo 'Bei fehlgeschlagenem Workflow: NICHT als getestete Alpha freigeben.'
          } > "$RUNNER_TEMP/wuerfelraunen-source/REPORT.txt"
      - name: Quellcode-ZIP, SHA256 und Fehlerbericht bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wuerfelraunen-source-checkpoint-${{ github.sha }}
          path: ${{ runner.temp }}/wuerfelraunen-source/
          if-no-files-found: warn
          retention-days: 30
