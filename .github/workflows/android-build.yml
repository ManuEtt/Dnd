name: Android-Alpha bauen

on:
  push:
    paths:
      - 'app/**'
      - 'backend/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'backend/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-alpha-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-apk:
    name: Prüfen und Debug-APK erstellen
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Java 17 installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter 3.35.7 installieren
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Node.js 22.14.0 installieren
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Backend-Abhängigkeiten installieren
        working-directory: backend
        run: npm ci
      - name: Backend-Typen prüfen
        working-directory: backend
        run: npm run typecheck
      - name: Backend bauen
        working-directory: backend
        run: npm run build
      - name: Backend testen
        working-directory: backend
        run: npm test
      - name: SQLite für Linux-Tests installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
      - name: Flutter-Abhängigkeiten installieren
        working-directory: app
        run: flutter pub get
      - name: Flutter-Code analysieren
        working-directory: app
        run: flutter analyze
      - name: Flutter-Tests ausführen
        working-directory: app
        env:
          RUN_BACKEND_SMOKE: '1'
        run: flutter test
      - name: Benötigte Android-SDK-Versionen installieren
        run: |
          sdkmanager "platforms;android-34" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Android-Debug-APK bauen
        working-directory: app
        run: |
          chmod +x android/gradlew
          flutter build apk --debug
      - name: Native Dateisicherungslogik testen
        working-directory: app/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: lebendiger-spielleiter-android-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
