name: Format Adventure HUD Fixes
on:
  push:
    branches:
      - feature/adventure-status-quests-20261019
    paths:
      - '.github/workflows/format-adventure-hud-fixes.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/adventure-status-quests-20261019
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Apply official Dart format
        run: |
          dart format app/lib/ui/app.dart app/lib/ui/fantasy_adventure_hud.dart app/test/fantasy_adventure_hud_test.dart
          dart format --output=none --set-exit-if-changed app/lib/ui/app.dart app/lib/ui/fantasy_adventure_hud.dart app/test/fantasy_adventure_hud_test.dart
      - name: Commit formatted files
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/lib/ui/app.dart app/lib/ui/fantasy_adventure_hud.dart app/test/fantasy_adventure_hud_test.dart
            git commit -m 'style(ui): format compact adventure status and quests'
            git push origin HEAD:feature/adventure-status-quests-20261019
          fi
