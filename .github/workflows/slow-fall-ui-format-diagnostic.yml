name: Slow Fall UI Dart format diagnostic
on:
  push:
    branches:
      - feat/chat-a/monk-slow-fall-ui-20261027
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Show exact official formatter diff
        run: |
          dart format app/lib/ui/app.dart app/lib/ui/monk_slow_fall_dialog.dart app/test/monk_slow_fall_dialog_test.dart app/test/monk_slow_fall_adventure_ui_test.dart
          git diff -- app/lib/ui/app.dart app/lib/ui/monk_slow_fall_dialog.dart app/test/monk_slow_fall_dialog_test.dart app/test/monk_slow_fall_adventure_ui_test.dart
