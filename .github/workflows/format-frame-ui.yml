name: Rahmen-UI Dart-Format einmalig

on:
  push:
    branches:
      - feature/ornate-frame-portrait-ui-20261019
    paths:
      - '.github/workflows/format-frame-ui.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ornate-frame-portrait-ui-20261019
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Geänderte Dart-Dateien formatieren
        run: |
          dart format app/lib/ui/fantasy_ui.dart app/lib/ui/fantasy_art.dart app/lib/ui/character_portrait_picker.dart app/test/original_fantasy_frame_test.dart
          dart format --output=none --set-exit-if-changed app/lib/ui/fantasy_ui.dart app/lib/ui/fantasy_art.dart app/lib/ui/character_portrait_picker.dart app/test/original_fantasy_frame_test.dart
      - name: Formatierung committen
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- app/lib/ui/fantasy_ui.dart app/lib/ui/fantasy_art.dart app/lib/ui/character_portrait_picker.dart app/test/original_fantasy_frame_test.dart
            git commit -m 'style(ui): format gold-frame and portrait UI'
            git push origin HEAD:feature/ornate-frame-portrait-ui-20261019
          fi
