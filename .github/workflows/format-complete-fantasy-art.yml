name: Format Complete Fantasy Art UI
on:
  push:
    branches:
      - feature/complete-fantasy-artwork-ui-20261019
    paths:
      - '.github/workflows/format-complete-fantasy-art.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complete-fantasy-artwork-ui-20261019
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Run official Dart formatter
        run: |
          dart format app/lib/ui/fantasy_ui.dart app/lib/ui/fantasy_art.dart app/lib/ui/character_portrait_picker.dart app/test/fantasy_complete_asset_integration_test.dart
          dart format --output=none --set-exit-if-changed app/lib/ui/fantasy_ui.dart app/lib/ui/fantasy_art.dart app/lib/ui/character_portrait_picker.dart app/test/fantasy_complete_asset_integration_test.dart
      - name: Commit format-only changes
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/lib/ui/fantasy_ui.dart app/lib/ui/fantasy_art.dart app/lib/ui/character_portrait_picker.dart app/test/fantasy_complete_asset_integration_test.dart
            git commit -m 'style(ui): format complete fantasy original art support'
            git push origin HEAD:feature/complete-fantasy-artwork-ui-20261019
          fi
