name: Chat A temporary sorcerous format diagnostic
on:
  pull_request:
    paths:
      - 'app/test/srd_sorcerous_restoration_class_preflight_test.dart'
      - '.github/workflows/chat-a-sorcerous-format-diagnostic.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Print canonical formatter diff without committing
        working-directory: app
        run: |
          set -euo pipefail
          dart format test/srd_sorcerous_restoration_class_preflight_test.dart
          git diff -- test/srd_sorcerous_restoration_class_preflight_test.dart
