name: Chat C Ward Dart Format Diagnostic
on:
  push:
    branches:
      - feat/chat-c/ward-management-large-text-20261106
jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Print exact formatter diff
        run: |
          dart format app/lib/ui/fantasy_effect_ward.dart app/test/fantasy_ward_management_large_text_test.dart
          git --no-pager diff -- app/lib/ui/fantasy_effect_ward.dart app/test/fantasy_ward_management_large_text_test.dart
