name: Chat A Eldritch Encounter Format Diff
on:
  push:
    paths:
      - '.github/workflows/chat-a-eldritch-encounter-format.yml'
jobs:
  exact-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Print exact Dart format changes
        run: |
          dart format app/lib/domain/game_engine.dart app/lib/services/game_controller.dart app/test/srd_eldritch_blast_encounter_test.dart
          git --no-pager diff -- app/lib/domain/game_engine.dart app/lib/services/game_controller.dart app/test/srd_eldritch_blast_encounter_test.dart
