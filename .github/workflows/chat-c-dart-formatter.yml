name: Chat C temporary Dart formatter
on:
  push:
    branches:
      - feat/chat-c/manual-extra-attack-ime-20261102
    paths:
      - .github/workflows/chat-c-dart-formatter.yml

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Print Dart formatted source for Chat C
        shell: bash
        run: |
          dart format app/lib/ui/manual_extra_creature_attack_dialog.dart app/test/manual_extra_creature_attack_ime_test.dart
          echo CHAT_C_FORMAT_START_UI
          base64 -w0 app/lib/ui/manual_extra_creature_attack_dialog.dart
          echo
          echo CHAT_C_FORMAT_END_UI
          echo CHAT_C_FORMAT_START_TEST
          base64 -w0 app/test/manual_extra_creature_attack_ime_test.dart
          echo
          echo CHAT_C_FORMAT_END_TEST
