name: Chat C Slow Fall targeted verification
on:
  push:
    branches:
      - feat/chat-c/slow-fall-ime-consent-20261102
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Resolve Flutter dependencies
        run: |
          cd app
          flutter pub get
      - name: Show exact official Dart formatter changes
        run: |
          cd app
          dart format lib/ui/monk_slow_fall_dialog.dart test/monk_slow_fall_dialog_test.dart
          git diff -- lib/ui/monk_slow_fall_dialog.dart test/monk_slow_fall_dialog_test.dart
      - name: Run Slow Fall widget tests
        run: |
          cd app
          flutter test test/monk_slow_fall_dialog_test.dart
