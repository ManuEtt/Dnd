name: Chat B temporary identity Dart formatter
on:
  push:
    branches:
      - feat/chat-b/npc-revision-context-20261026
jobs:
  print-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.9.2'
      - name: Print formatter diff for new identity files
        run: |
          dart format app/lib/story/npc_identity_memory.dart app/test/npc_identity_memory_test.dart
          git diff -- app/lib/story/npc_identity_memory.dart app/test/npc_identity_memory_test.dart
