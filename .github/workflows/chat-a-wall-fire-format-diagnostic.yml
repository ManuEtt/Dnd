name: Chat A Wall of Fire formatter diagnostic (temporary)
on:
  push:
    branches:
      - feat/chat-a/wall-of-fire-ring-preview-20261028

jobs:
  dart-format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Print exact Dart formatter patch
        run: |
          cd app
          dart format lib/domain/srd_wall_of_fire_ring_rules.dart test/srd_wall_of_fire_ring_rules_test.dart
          git diff -- lib/domain/srd_wall_of_fire_ring_rules.dart test/srd_wall_of_fire_ring_rules_test.dart
