name: Einmalige Stufenaufstieg-Formatierung
on:
  push:
    branches: 
      - feature/complete-character-level-up-20261019
    paths:
      - '.github/workflows/levelup-format-once.yml'
permissions:
  contents: write
jobs:
  format:
    if: "github.event.head_commit.message == 'chore: apply one-time level-up formatting'"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complete-character-level-up-20261019
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Dart-Formatierung
        working-directory: app
        run: |
          dart format lib/domain/models.dart lib/domain/srd_class_level_up.dart lib/domain/srd_class_feature_catalog.dart lib/domain/multiclass_rules.dart lib/ui/srd_class_level_up_dialog.dart lib/ui/multiclass_selection_dialog.dart lib/ui/character_editor.dart lib/ui/fantasy_character_sheet.dart test/full_level_up_progression_test.dart test/multiclass_dialog_test.dart
          dart format --output=none --set-exit-if-changed lib test
      - name: Formatierten Stand committen
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib app/test
          if ! git diff --cached --quiet; then
            git commit -m "style(levelup): format with Dart 3"
            git push origin HEAD:feature/complete-character-level-up-20261019
          fi
