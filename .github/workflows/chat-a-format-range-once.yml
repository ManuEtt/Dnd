name: Chat A - einmalige Reichweiten-Testformatierung
on:
  push:
    branches:
      - feat/chat-a/spell-range-canonical-metadata-20261030
    paths:
      - .github/workflows/chat-a-format-range-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Formatiere nur den neuen Chat-A-Test mit Dart 3.9
        working-directory: app
        run: |
          dart --version
          dart format test/srd_spell_range_metadata_guard_test.dart
          dart format --output=none --set-exit-if-changed test/srd_spell_range_metadata_guard_test.dart
      - name: Committe nur die Formatierung des neuen Testfalls
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if ! git diff --quiet -- app/test/srd_spell_range_metadata_guard_test.dart; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- app/test/srd_spell_range_metadata_guard_test.dart
            git commit -m 'style(chat-a): format canonical range test with Dart 3.9'
            git push origin HEAD:feat/chat-a/spell-range-canonical-metadata-20261030
          fi
