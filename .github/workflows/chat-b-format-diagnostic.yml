name: Chat B temporary Dart format diagnostic
on:
  push:
    branches:
      - feat/chat-b/confirmed-place-resume-20261102
jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Print exact Dart formatter diff
        run: |
          dart format app/test/confirmed_place_resume_selection_test.dart
          git --no-pager diff -- app/test/confirmed_place_resume_selection_test.dart
