name: Chat E temporary Dart formatter

on:
  push:
    branches:
      - feat/chat-e/savage-attacker-roll-choice-20261027

permissions:
  contents: read

jobs:
  dart-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.9.2'
      - name: Format changed Dart files and emit exact verified source
        shell: bash
        run: |
          set -euo pipefail
          cd app
          files=(
            lib/domain/srd_savage_attacker_rules.dart
            test/srd_savage_attacker_rules_test.dart
          )
          dart format "${files[@]}"
          for file in "${files[@]}"; do
            echo "BEGIN_FORMATTED_FILE:$file"
            base64 -w 0 "$file"
            echo
            echo "END_FORMATTED_FILE:$file"
          done
