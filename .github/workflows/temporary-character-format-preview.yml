name: Temporary character Dart formatting preview
on:
  push:
    branches:
      - fix/character-editor-stale-save-20261028
jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
      - name: Show exact formatter diff
        shell: bash
        run: |
          cd app
          dart format lib/data/sqlite_campaign_repository.dart lib/ui/app.dart test/character_editor_stale_save_test.dart
          git --no-pager diff -- lib/data/sqlite_campaign_repository.dart lib/ui/app.dart test/character_editor_stale_save_test.dart
