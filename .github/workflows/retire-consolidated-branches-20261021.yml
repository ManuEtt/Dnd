name: One-time audited branch retirement (2026-10-21)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-consolidated-branches-20261021.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audited-branch-retirement-20261021
  cancel-in-progress: false

jobs:
  retire:
    name: Verify integration and retire only allowlisted branches
    if: github.repository == 'ManuEtt/Dnd' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Safety checks
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -v
      - name: Revalidate upstream SHA and delete verified old branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/retire_consolidated_branches_20261021.py --execute
