name: Einmalige Fantasy-UI-Formatierung (korrigiert)
on:
  push:
    branches:
      - feature/fantasy-portraits-and-ui-20261019
    paths:
      - .github/workflows/format-fantasy-ui-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fantasy-portraits-and-ui-20261019
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Abhängigkeiten und offizielle Dart-Formatierung
        working-directory: app
        run: |
          flutter pub get
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test
      - name: Nur geprüfte App-Dateien sichern
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then exit 0; fi
          if git diff --name-only | grep -vE '^app/(lib|test)/.*[.]dart$|^app/pubspec[.]lock$'; then
            echo 'Unexpected change' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/lib app/test app/pubspec.lock
          git commit -m 'style: format fantasy UI and lock Android image picker'
          git push origin HEAD:refs/heads/feature/fantasy-portraits-and-ui-20261019
