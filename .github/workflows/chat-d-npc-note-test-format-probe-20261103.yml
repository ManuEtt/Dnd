name: Chat D temporary NPC note test format probe
on:
  push:
    branches:
      - feat/chat-b/confirmed-npc-note-id-integrity-20261103
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.9.2'
      - name: Show official formatting of NPC integrity test
        run: |
          echo 'NPC_TEST_FORMAT_START'
          dart format --output=show app/test/npc_identity_note_id_integrity_test.dart
          echo 'NPC_TEST_FORMAT_END'
