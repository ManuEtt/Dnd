name: Chat B temporary NPC outbox formatter
on:
  push:
    branches:
      - fix/chat-b/npc-outbox-cas-20261027
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.9.2'
      - name: Show official formatted sources
        run: |
          echo 'CHAT_B_BEGIN_0'
          dart format --output=show app/lib/data/campaign_repository.dart
          echo 'CHAT_B_END_0'
          echo 'CHAT_B_BEGIN_1'
          dart format --output=show app/lib/data/sqlite_campaign_repository.dart
          echo 'CHAT_B_END_1'
          echo 'CHAT_B_BEGIN_2'
          dart format --output=show app/lib/services/player_action_outbox.dart
          echo 'CHAT_B_END_2'
          echo 'CHAT_B_BEGIN_3'
          dart format --output=show app/test/npc_selected_action_outbox_test.dart
          echo 'CHAT_B_END_3'
