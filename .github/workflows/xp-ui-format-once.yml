name: XP-UI-Formatierung einmalig
on:
  push:
    branches: [feature/rabenwacht-quest-journal-20261019]
    paths:
      - '.github/workflows/xp-ui-format-once.yml'
permissions:
  contents: write
jobs:
  fix:
    if: "github.event.head_commit.message == 'chore: format final XP UI'"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rabenwacht-quest-journal-20261019
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Dart-Formatierung und Prüfung
        working-directory: app
        run: |
          dart format lib/domain/campaign_experience.dart lib/domain/rabenwacht_campaign.dart lib/ui/app.dart test/campaign_experience_test.dart
          dart format --output=none --set-exit-if-changed lib test
      - name: Formatierte Dateien übernehmen
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/domain/campaign_experience.dart app/lib/domain/rabenwacht_campaign.dart app/lib/ui/app.dart app/test/campaign_experience_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "style(xp): final formatter pass"
            git push origin HEAD:feature/rabenwacht-quest-journal-20261019
          fi
