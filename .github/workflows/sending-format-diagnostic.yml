name: Temporary Sending format diagnostics
on:
  push:
    branches:
      - feature/sending-confirmation-dialog-20261024
    paths:
      - '.github/workflows/sending-format-diagnostic.yml'
permissions:
  contents: read
jobs:
  format-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Format changed Dart files
        run: dart format app/lib/ui/app.dart app/lib/ui/sending_attempt_dialog.dart app/test/sending_attempt_dialog_test.dart
      - name: Output exact formatter changes
        run: |
          echo 'FORMAT_PATCH_START'
          git diff --no-ext-diff --unified=1 -- app/lib/ui/app.dart app/lib/ui/sending_attempt_dialog.dart app/test/sending_attempt_dialog_test.dart
          echo 'FORMAT_PATCH_END'
      - name: Check analyzer and focused UI test
        run: |
          cd app
          flutter pub get
          flutter analyze
          flutter test test/sending_attempt_dialog_test.dart
