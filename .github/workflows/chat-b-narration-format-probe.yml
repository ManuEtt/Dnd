name: Chat B narration Dart formatter check
on:
  push:
    branches:
      - feat/chat-b/narration-provider-format-guard-20261105
    paths:
      - .github/workflows/chat-b-narration-format-probe.yml
      - app/test/narration_provider_unicode_boundary_test.dart
      - app/lib/story/story_campaign_engine.dart
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Show exact official Dart formatting difference
        run: |
          dart format app/lib/story/story_campaign_engine.dart app/test/narration_provider_unicode_boundary_test.dart
          git diff -- app/lib/story/story_campaign_engine.dart app/test/narration_provider_unicode_boundary_test.dart
