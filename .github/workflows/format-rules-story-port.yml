name: Temporary Rules-Story Port Dart Formatter

on:
  push:
    branches:
      - feature/rules-story-module-boundary-20261021
    paths:
      - .github/workflows/format-rules-story-port.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'ManuEtt/Dnd'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rules-story-module-boundary-20261021
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Official Dart formatting of newly decoupled modules
        shell: bash
        run: |
          set -euo pipefail
          dart format app/lib/domain/rabenwacht_campaign.dart app/lib/domain/ai_story.dart app/lib/story/ai_story.dart app/lib/story/rabenwacht_campaign.dart app/lib/story/story_rule_port.dart app/lib/story/story_api.dart app/lib/story/story_campaign_engine.dart app/test/rules_story_port_integration_test.dart
          dart format --output=none --set-exit-if-changed app/lib/domain/rabenwacht_campaign.dart app/lib/domain/ai_story.dart app/lib/story/ai_story.dart app/lib/story/rabenwacht_campaign.dart app/lib/story/story_rule_port.dart app/lib/story/story_api.dart app/lib/story/story_campaign_engine.dart app/test/rules_story_port_integration_test.dart
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/lib/domain/rabenwacht_campaign.dart app/lib/domain/ai_story.dart app/lib/story/ai_story.dart app/lib/story/rabenwacht_campaign.dart app/lib/story/story_rule_port.dart app/lib/story/story_api.dart app/lib/story/story_campaign_engine.dart app/test/rules_story_port_integration_test.dart
          if ! git diff --cached --quiet; then
            git commit -m 'style(architecture): format decoupled story and rules interface'
            git push origin HEAD:feature/rules-story-module-boundary-20261021
          fi
