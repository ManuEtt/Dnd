name: Rabenwacht Namenchor Dart Formatter (temporär)

on:
  push:
    branches:
      - feature/rabenwacht-namenchor-main-20261021

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Die neue Story und Regressionstests formatieren
        run: |
          set -euo pipefail
          cd app
          dart format lib/domain/rabenwacht_campaign.dart test/rabenwacht_hymn_story_test.dart
          dart format --output=none --set-exit-if-changed lib/domain/rabenwacht_campaign.dart test/rabenwacht_hymn_story_test.dart
          cd ..
          git diff --check
      - name: Offizielle Dart-Formatierung speichern
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/lib/domain/rabenwacht_campaign.dart app/test/rabenwacht_hymn_story_test.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style(rabenwacht): format Namenchor narrative using Dart 3.9'
          git push origin HEAD:feature/rabenwacht-namenchor-main-20261021
