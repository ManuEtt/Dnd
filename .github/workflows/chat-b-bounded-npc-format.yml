name: Chat B temporary bounded NPC Dart formatter
on:
  push:
    branches:
      - feat/chat-b/bounded-confirmed-npc-excerpt-20261102
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.9.2'
      - name: Output official Dart formatting
        run: |
          echo 'CHAT_B_BOUNDED_BEGIN_MODULE'
          dart format --output=show app/lib/story/confirmed_npc_continuity_excerpt.dart
          echo 'CHAT_B_BOUNDED_END_MODULE'
          echo 'CHAT_B_BOUNDED_BEGIN_TEST'
          dart format --output=show app/test/confirmed_npc_continuity_excerpt_test.dart
          echo 'CHAT_B_BOUNDED_END_TEST'
