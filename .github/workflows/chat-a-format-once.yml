name: Chat A - einmalige Dart-Formatierung im Arbeitsbranch
on:
  push:
    branches:
      - feat/chat-a/spell-component-metadata-guard-20261030
    paths:
      - .github/workflows/chat-a-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Formatiere genau den neuen Chat-A-Regressionstest
        working-directory: app
        run: |
          dart --version
          dart format test/srd_spell_component_flag_guard_test.dart
      - name: Committe ausschließlich Formatierungsdifferenzen
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if ! git diff --quiet -- app/test/srd_spell_component_flag_guard_test.dart; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- app/test/srd_spell_component_flag_guard_test.dart
            git commit -m 'style(chat-a): apply official Dart 3.9 formatter to regression test'
            git push origin HEAD:feat/chat-a/spell-component-metadata-guard-20261030
          fi
