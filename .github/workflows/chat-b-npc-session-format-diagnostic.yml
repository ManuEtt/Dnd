name: Chat B NPC session format diagnostic
on:
  push:
    branches:
      - feat/chat-b/npc-identity-session-guard-20261029
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.9.2'
      - name: Compare official Dart-format output
        run: |
          dart format app/test/npc_identity_memory_session_guard_test.dart
          echo 'CHAT_B_DIFF_BEGIN'
          git diff -- app/test/npc_identity_memory_session_guard_test.dart
          echo 'CHAT_B_DIFF_END'
