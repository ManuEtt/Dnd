name: Chat C equipment loadout targeted verification (temporary)
on:
  push:
    branches:
      - feat/chat-c/equipment-loadout-large-text-ime-20261030
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Dependencies
        run: cd app && flutter pub get
      - name: Print exact Dart formatter changes
        run: |
          cd app
          dart format lib/ui/equipment_loadout_dialog.dart test/equipment_loadout_ime_test.dart
          git diff -- lib/ui/equipment_loadout_dialog.dart test/equipment_loadout_ime_test.dart
      - name: Targeted equipment widget tests
        run: |
          cd app
          flutter test test/equipment_loadout_ime_test.dart --reporter expanded
          flutter test test/ui_equipment_loadout_test.dart --reporter expanded
