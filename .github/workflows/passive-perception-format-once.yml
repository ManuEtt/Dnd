name: Einmalige Formatierung passive Wahrnehmung
on:
  push:
    branches:
      - feature/passive-perception-rulebook-20261019
    paths:
      - '.github/workflows/passive-perception-format-once.yml'
permissions:
  contents: write
jobs:
  format:
    if: "github.event.head_commit.message == 'chore: format passive Perception once'"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/passive-perception-rulebook-20261019
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Dart-Dateien formatieren
        working-directory: app
        run: |
          dart format lib/domain/character_rule_engine.dart lib/domain/game_engine.dart lib/ui/fantasy_character_sheet.dart test/passive_perception_test.dart
          dart format --output=none --set-exit-if-changed lib test
      - name: Nur formatierte Änderungen einchecken
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib app/test
          if ! git diff --cached --quiet; then
            git commit -m "style(passive): format with Dart 3"
            git push origin HEAD:feature/passive-perception-rulebook-20261019
          fi
