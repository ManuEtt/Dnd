name: Einmalige Formatierung Bewusstlos-Liegend

on:
  push:
    branches:
      - feature/condition-source-ledger-20261018
    paths:
      - .github/workflows/format-prone-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/condition-source-ledger-20261018
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Offizielle Dart-Formatierung der geaenderten Dateien
        working-directory: app
        run: |
          dart format lib/domain/condition_rules.dart lib/domain/rules_engine.dart lib/domain/death_saving_throw_rules.dart lib/domain/condition_effects.dart lib/domain/game_engine.dart test/unconscious_prone_test.dart
          dart format --output=none --set-exit-if-changed lib test
      - name: Nur Dart-Formatierung committen
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then exit 0; fi
          if git diff --name-only | grep -vE '^app/(lib|test)/.*[.]dart$'; then
            echo 'Unerwartete Dateiaenderung' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/lib app/test
          git commit -m 'style: apply Dart 3.9.2 formatting to unconscious/prone rules'
          git push origin HEAD:refs/heads/feature/condition-source-ledger-20261018
